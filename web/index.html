<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="toolbar">
  <select id="view-picker" aria-label="Tree view"></select>
  <input id="search" placeholder="Search a name (add up to 3)" autocomplete="off">
  <button id="more" aria-label="More options">⋯</button>
  <span id="extras">
    <button id="lang" title="Switch names: EN → हिं → EN+हिं">EN+हिं</button>
    <button id="expand-all">Expand all</button>
    <button id="reset">Fit to screen</button>
  </span>
  <span class="summary" id="summary"></span>
  <div id="picks"></div>
</div>
<div id="stage"><svg><g id="viewport"></g></svg>
  <p id="ornament-motto">Generations grow,<br>roots stay forever</p>
  <p id="ornament-story">Our Roots<br>Our Family<br>Our Story</p>
</div>
<div id="unlinked"></div>
<div id="suggest" class="hidden"></div>
<div id="sheet" class="hidden">
  <button id="sheet-close" aria-label="Close">×</button>
  <div id="sheet-body"></div>
</div>
<script id="tree-data" type="application/json">/*__TREE__*/</script>
<script id="unlinked-data" type="application/json">/*__UNLINKED__*/</script>
<script id="summary-data" type="application/json">/*__SUMMARY__*/</script>
<script>/*__APP_JS__*/</script>
</body>
</html>
