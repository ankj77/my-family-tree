<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jain Parivar Online · Links</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F2E4">
<link rel="icon" href="web/icons/icon-192.png">
<link rel="apple-touch-icon" href="web/icons/apple-touch-icon.png">
<style>/*__CSS__*/
  html,body{height:auto;}
  body{display:block;overflow:auto;}
  #links{max-width:1100px;margin:0 auto;padding:16px;box-sizing:border-box;color:var(--ink);}
  #links a{color:var(--hl);}
  #links h1{font-family:var(--serif);font-size:26px;margin:8px 0 12px;color:#7A1F1F;
    display:flex;align-items:center;gap:8px;}
  #lk-form{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  #lk-form>div{flex:1 1 260px;position:relative;}
  .lk-pick{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-muted);flex:1 1 220px;}
  .lk-results{display:flex;flex-direction:column;}
  .lk-results button{min-height:44px;text-align:left;padding:6px 10px;border:1px solid var(--rule);border-top:0;
    background:var(--card);cursor:pointer;font-family:var(--font);font-size:14px;}
  .lk-results button span{color:var(--ink-muted);font-size:12px;}
  .lk-results button:hover{background:var(--canvas);}
  .lk-go{display:inline-block;min-height:44px;line-height:44px;padding:0 18px;background:var(--hl);color:#fff !important;
    text-decoration:none;border-radius:6px;font-size:16px;}
  .lk-grid{display:flex;flex-wrap:wrap;gap:12px;}
  .lk-relation{font-size:13px;font-weight:600;color:var(--hl);margin-bottom:2px;}
  .lk-pick input,.lk-pick select{min-height:44px;font-size:16px;padding:6px 10px;border:1px solid var(--edge);
    background:var(--card);font-family:var(--font);box-sizing:border-box;width:100%;}
  .lk-summary{font-family:var(--serif);font-size:19px;margin:0 0 16px;color:var(--name-ink);}
  .lk-msg{color:var(--ink-muted);}
  .lk-couples{display:flex;flex-direction:column;gap:14px;}
  .lk-couple{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .lk-card{display:flex;flex-direction:column;gap:2px;width:260px;box-sizing:border-box;padding:10px 14px;
    background:var(--card);border:1.5px solid var(--rail-unknown);border-radius:10px;box-shadow:var(--shadow-card);
    text-decoration:none;color:var(--ink) !important;}
  .lk-card.male{background:var(--card-m);border-color:var(--rail-m);}
  .lk-card.female{background:var(--card-f);border-color:var(--rail-f);}
  .lk-card b{font-family:var(--serif);font-size:17px;color:var(--name-ink);}
  .lk-hi{font-size:14px;}
  .lk-meta{font-size:13px;color:var(--ink-muted);}
  .lk-rel{font-size:13px;margin-top:4px;padding-top:4px;border-top:1px solid var(--rule);}
  .lk-married{font-size:14px;font-weight:600;color:var(--rail-f);padding:0 4px;}
  .lk-list{padding-left:18px;line-height:1.9;}
  .lk-list button{min-height:36px;border:0;background:none;color:var(--hl);text-decoration:underline;
    cursor:pointer;font-size:15px;padding:0;}
</style>
</head>
<body>
<div id="links">
  <p><a href="./">← Back to the tree</a></p>
  <h1><img class="brand-logo" src="web/icons/emblem.png" alt="">How are we linked?</h1>
  <div id="lk-form"></div>
  <main id="lk-result" aria-live="polite"></main>
</div>
<script>/*__APP_JS__*/</script>
</body>
</html>
