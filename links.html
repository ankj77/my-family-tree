<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jain Parivar Online · Links</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F2E4">
<link rel="icon" href="web/icons/icon-192.png">
<link rel="apple-touch-icon" href="web/icons/apple-touch-icon.png">
<style>:root{
  --canvas:#F7F2E4;
  --card:#FFFDF7;
  --edge:#B9C6A4;
  --rule:#DEE4CC;
  --rail-m:#4A6FA5;
  --rail-f:#C4708A;
  --rail-unknown:#A89880;
  --card-m:#EEF3FA;
  --card-f:#FBEFF3;
  --ink:#3A3A2E;
  --ink-muted:#6F6A57;
  --name-ink:#234A21;
  --living:#4A8C4A;
  --connector:#A8935F;
  --bark:#8A6240;
  --bark-trunk:#6B4A2E;
  --leaf-1:#6F9C52;
  --leaf-2:#8FBA6C;
  --leaf-3:#BCD79C;
  --leaf-spouse:#E7C4D3;
  --hl:#C86B2A;
  --warn:#B5432F;
  --band:#EFE7D2;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI",sans-serif;
  --serif:"Iowan Old Style",Georgia,"Times New Roman","Noto Serif Devanagari",serif;
  --shadow-card:0 1px 2px rgba(70,60,30,.07),0 4px 10px rgba(70,60,30,.06);
}
  html,body{margin:0;height:100%;font-family:var(--font);}
  body{display:flex;flex-direction:column;background:var(--canvas);}
  #toolbar{flex:0 0 auto;position:relative;padding:12px 16px 0;background:var(--card);
    border-bottom:1px solid var(--edge);box-shadow:var(--shadow-card);z-index:10;
    box-sizing:border-box;font-size:13px;font-weight:500;color:var(--ink);}
  #toolbar .top-row{display:flex;align-items:center;gap:10px;}
  #toolbar .brand{flex:1 1 auto;min-width:0;}
  #toolbar .title{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;
    line-height:1.15;color:#7A1F1F;display:flex;align-items:center;gap:8px;}
  .brand-logo{width:44px;height:44px;flex:0 0 auto;mix-blend-mode:multiply;}
  #toolbar .who{margin:2px 0 0;min-height:1.3em;font-size:13px;color:var(--ink-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #top-actions{display:flex;gap:8px;}
  .menu-wrap{position:relative;}
  #avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--card);
    box-shadow:0 0 0 1px var(--edge);background:var(--name-ink);color:#fff;cursor:pointer;
    font-family:var(--serif);font-size:19px;font-weight:600;padding:0;}
  #menu{position:absolute;right:0;top:52px;min-width:220px;background:var(--card);
    border:1px solid var(--edge);border-radius:10px;box-shadow:var(--shadow-card);
    padding:6px;z-index:40;}
  #menu.hidden{display:none;}
  .menu-version{margin:4px 12px 6px;font-size:12px;color:var(--ink-muted);}
  #menu button{display:block;width:100%;min-height:44px;text-align:left;padding:8px 12px;
    background:none;border:0;border-radius:7px;font-family:var(--font);font-size:15px;
    color:var(--ink);cursor:pointer;}
  #menu button:hover{background:var(--canvas);}
  #toolbar .search-row{position:relative;max-width:680px;margin:12px auto 0;}
  #toolbar .search-icon{position:absolute;left:14px;top:12px;width:20px;height:20px;
    fill:none;stroke:var(--ink-muted);stroke-width:2;stroke-linecap:round;pointer-events:none;}
  #search{width:100%;box-sizing:border-box;min-height:46px;padding:8px 16px 8px 44px;
    border:1px solid var(--edge);border-radius:999px;background:var(--canvas);
    font-size:16px;font-family:var(--font);color:var(--ink);}
  #search:focus{outline:2px solid var(--hl);outline-offset:1px;background:var(--card);}
  #toolbar .search-hint{margin:4px 0 0;text-align:center;font-size:12px;color:var(--ink-muted);}
  #picks:not(:empty){display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;}
  #toolbar .summary{margin:10px -16px 0;padding:8px 16px;background:var(--band);
    border-top:1px solid var(--edge);font-size:13px;line-height:1.5;color:var(--ink);}
  #toolbar .summary b{font-weight:700;}
  #stage{flex:1 1 auto;position:relative;overflow:hidden;background:var(--canvas);
    cursor:grab;touch-action:none;}
  #stage.grabbing{cursor:grabbing;}
  svg{width:100%;height:100%;display:block;}
  .edge{fill:none;stroke:var(--connector);stroke-width:1.25px;}
  .edge.hl{stroke:var(--hl);stroke-width:2.5px;}
  .toggle{fill:var(--card);stroke:var(--bark);stroke-width:2px;cursor:pointer;
    pointer-events:none;}
  .toggle-sign{font-size:15px;font-weight:700;fill:var(--bark);font-family:var(--font);
    cursor:pointer;pointer-events:none;}
  .branch-btn{cursor:pointer;}
  .branch-btn rect{fill:var(--card);stroke:var(--bark);stroke-width:1.5px;}
  .branch-btn text{font-size:22px;font-weight:600;fill:var(--name-ink);font-family:var(--font);}
  .branch-btn:hover rect{fill:var(--band);}
  .toggle-hit{fill:transparent;cursor:pointer;pointer-events:all;}
  #unlinked{position:absolute;right:0;top:0;width:230px;max-width:70%;max-height:45%;overflow:auto;background:var(--card);
    border-left:1px solid var(--edge);border-bottom:1px solid var(--edge);padding:8px;font-size:12px;z-index:5;box-sizing:border-box;}
  #unlinked h4{margin:0 0 6px;}
  #unlinked.empty{display:none;}
  .card-bg{fill:var(--card);stroke:var(--edge);stroke-width:1.25px;}
  .card-shadow{fill:var(--ink);opacity:.09;pointer-events:none;}
  .card-hit{fill:transparent;pointer-events:all;}
  .card-name{font-size:14px;font-weight:600;font-family:var(--serif);
    fill:var(--name-ink);pointer-events:none;}
  .card-meta{font-size:11px;fill:var(--ink-muted);pointer-events:none;}
  .living-dot{fill:var(--living);pointer-events:none;}
  .card-row{cursor:pointer;}
  .card-row.unfilled{cursor:default;}
  .card-row.unfilled .card-name{fill:var(--ink-muted);font-style:italic;font-weight:400;}
  .card-row.deceased .card-rail{opacity:.7;}
  .card-row.deceased .card-name{fill:var(--ink-muted);}
  .card-row.uncertain .card-name{fill:var(--warn);}
  .card.hl .card-bg{stroke:var(--hl);stroke-width:2px;}
  .avatar{pointer-events:none;}
  #sheet{position:absolute;right:0;top:0;bottom:0;width:320px;background:var(--card);
    border-left:4px solid var(--rail-unknown);box-shadow:var(--shadow-card);
    padding:16px;overflow:auto;z-index:20;box-sizing:border-box;font-size:13px;color:var(--ink);}
  #sheet.hidden{display:none;}
  #sheet-close{position:absolute;right:8px;top:8px;width:44px;height:44px;
    border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--ink-muted);}
  .sheet-photo{display:block;width:96px;height:96px;border-radius:50%;
    object-fit:cover;margin:0 auto 10px;border:1px solid var(--edge);}
  #sheet h3{margin:0 0 2px;text-align:center;font-size:18px;font-weight:600;
    font-family:var(--serif);color:var(--name-ink);}
  .sheet-hi{margin:0 0 12px;text-align:center;color:var(--ink-muted);}
  #sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;}
  #sheet dt{color:var(--ink-muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
  #sheet dd{margin:0;font-size:13px;color:var(--ink);}
  .sheet-rel{margin-top:12px;padding-top:10px;border-top:1px solid var(--edge);line-height:1.9;}
  .sheet-rel span{color:var(--ink-muted);margin-right:4px;}
  .sheet-rel a{color:var(--rail-m);text-decoration:none;}
  #ornament-motto,#ornament-story{position:absolute;margin:0;pointer-events:none;
    font-family:var(--serif);font-style:italic;color:var(--name-ink);opacity:.75;z-index:4;}
  #ornament-motto{left:16px;bottom:16px;font-size:15px;line-height:1.45;
    background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:10px 14px;}
  .motto-version{display:block;margin-top:4px;font-family:var(--font);font-style:normal;font-size:11px;color:var(--ink-muted);}
  .login-version{margin:10px 0 0;text-align:center;font-size:12px;color:var(--ink-muted);}
  #ornament-story{right:20px;bottom:20px;font-size:24px;line-height:1.3;text-align:right;}
  @media (max-width:768px){
    #ornament-motto{display:none;}
    #ornament-story{font-size:16px;right:12px;bottom:12px;}
  }
  #controls{position:absolute;top:12px;right:12px;z-index:6;display:flex;flex-direction:column;
    align-items:flex-end;gap:6px;cursor:default;}
  #controls-toggle{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);
    background:var(--card);box-shadow:var(--shadow-card);font-size:20px;cursor:pointer;color:var(--ink);}
  #controls-body{display:none;width:220px;background:var(--card);border:1px solid var(--edge);
    border-radius:10px;box-shadow:var(--shadow-card);padding:8px 12px;box-sizing:border-box;}
  #controls.open #controls-body{display:block;}
  #controls .ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;
    min-height:44px;font-size:14px;color:var(--ink);border-bottom:1px solid var(--rule);}
  #controls select{min-height:36px;max-width:130px;font-size:14px;font-family:var(--font);
    border:1px solid var(--edge);border-radius:6px;background:var(--card);color:var(--ink);}
  #controls .ctl-switch{cursor:pointer;}
  #living-only{width:20px;height:20px;accent-color:var(--hl);cursor:pointer;}
  #controls .zoom-buttons{display:flex;gap:4px;}
  #controls .zoom-buttons button{min-width:40px;min-height:36px;border:1px solid var(--edge);
    border-radius:6px;background:var(--card);font-size:15px;cursor:pointer;color:var(--ink);}
  #expand-all{display:block;width:100%;margin-top:8px;min-height:40px;border:1px solid var(--edge);
    border-radius:6px;background:var(--card);font-size:14px;cursor:pointer;color:var(--ink);}
  @media (max-width:768px){
    #sheet{right:0;left:0;top:auto;bottom:0;width:auto;max-height:60%;
      border-left:0;border-top:1px solid var(--edge);border-radius:12px 12px 0 0;
      box-shadow:var(--shadow-card);}
    #toolbar{padding:10px 12px 0;}
    #toolbar .title{font-size:22px;}
    #toolbar .summary{margin:8px -12px 0;padding:6px 12px;font-size:12px;}
  }
  .poster-ground{fill:var(--connector);opacity:.22;}
  .poster-root{fill:none;stroke:var(--bark-trunk);stroke-linecap:round;opacity:.85;}
  .poster-trunk{fill:var(--bark-trunk);}
  .poster-branch{fill:none;stroke:var(--bark);stroke-linecap:round;}
  .poster-branch.hl{stroke:var(--hl);}
  .poster-leaf{stroke:none;}
  .parent-card .pc-name{font-family:var(--serif);font-size:14.5px;font-weight:600;
    fill:var(--name-ink);pointer-events:none;}
  .parent-card.male .card-bg{fill:var(--card-m);stroke:var(--rail-m);}
  .parent-card.female .card-bg{fill:var(--card-f);stroke:var(--rail-f);}
  .pc-motif{pointer-events:none;}
  .pc-motif .petal{fill:var(--rail-f);opacity:.9;}
  .pc-motif .petal.outer{opacity:.55;}
  .pc-motif.female .motif-line{stroke:var(--leaf-1);}
  .pc-motif .leaf{fill:var(--leaf-1);}
  .pc-motif .vein{stroke:var(--card-m);stroke-width:.8px;}
  .garland{pointer-events:none;}
  .garland .leaf{fill:var(--leaf-1);}
  .garland-rope{fill:none;stroke:#D9731A;stroke-width:9px;stroke-linecap:round;}
  .curl{stroke:#B35A0E;stroke-width:.7px;}
  .rose{fill:#B3121B;stroke:#7A0A10;stroke-width:.7px;}
  .rose-core{fill:#D62A33;}
  .spouse-link{stroke:var(--rail-f);stroke-width:3px;}
  .ft-arrow{fill:var(--bark);}
  .pick-x{min-width:34px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:50%;font-size:18px;color:var(--ink-muted);text-decoration:none;}
  a.pick-clear{display:inline-flex;align-items:center;text-decoration:none;color:inherit;}
  .pick-who{font-family:var(--font);font-size:12px;color:var(--ink-muted);}
  .chart-edge{fill:none;stroke:var(--connector);stroke-width:2.5px;}
  .chart-label{font-family:var(--font);font-size:15px;font-weight:600;fill:var(--ink-muted);pointer-events:none;}
  .chart-marriage{stroke:var(--rail-f);stroke-width:3px;}
  .chart-married{text-anchor:middle;font-size:15px;fill:var(--rail-f);}
  .spouse-card{cursor:pointer;}
  .gap-bg{fill:transparent;stroke:var(--ink-muted);stroke-width:1.6px;stroke-dasharray:7 5;cursor:pointer;}
  .card .place-hit .card-bg{stroke:#D9731A;stroke-width:3px;}
  .sg-place .sg-name::before{content:'\2302  ';color:#D9731A;}
  .sg-place.area .sg-name::before,.sg-place.city .sg-name::before{content:'\25C9  ';color:var(--rail-m);}
  .spouse-card.male .card-bg{fill:var(--card-m);stroke:var(--rail-m);}
  .spouse-card.female .card-bg{fill:var(--card-f);stroke:var(--rail-f);}
  .motif-line{fill:none;stroke:var(--bark);stroke-width:1.4px;stroke-linecap:round;}
  .pc-sub{font-size:11.5px;fill:var(--ink-muted);pointer-events:none;}
  .pc-rule{stroke:var(--rule);stroke-width:1px;}
  .pc-label{font-size:9.5px;fill:var(--ink-muted);letter-spacing:.05em;pointer-events:none;}
  .pc-value{font-size:12.5px;fill:var(--ink);pointer-events:none;}
  .pc-icon-bg{opacity:.28;pointer-events:none;}
  .pc-icon-fg{opacity:.95;pointer-events:none;}
  .pc-icon-cut{fill:var(--card);pointer-events:none;}
  #picks{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding-top:2px;}
  #picks:empty{display:none;}
  .pick{display:inline-flex;align-items:center;gap:4px;min-height:38px;
    padding:2px 4px 2px 14px;border:1px solid var(--edge);border-radius:999px;
    background:var(--canvas);font-family:var(--serif);font-size:15px;
    color:var(--name-ink);}
  .pick button{min-width:34px;min-height:34px;border:0;border-radius:50%;
    background:none;font-size:18px;line-height:1;color:var(--ink-muted);cursor:pointer;}
  .pick-place{border-color:#D9731A;}
  .pick button:hover{background:var(--card);color:var(--warn);}
  .pick-clear{min-height:38px;padding:0 14px;border:1px solid var(--edge);
    border-radius:999px;background:var(--card);font-family:var(--font);
    font-size:13px;color:var(--ink-muted);cursor:pointer;}
  .pick-note{font-size:14px;color:var(--ink-muted);}
  .pick-note b{font-family:var(--serif);font-size:15px;color:var(--hl);}
  #suggest{position:fixed;z-index:30;max-height:52vh;overflow-y:auto;
    background:var(--card);border:1px solid var(--edge);border-radius:10px;
    box-shadow:var(--shadow-card);padding:4px;box-sizing:border-box;}
  #suggest.hidden{display:none;}
  .sg-row{display:block;width:100%;min-height:44px;text-align:left;cursor:pointer;
    background:none;border:0;border-radius:7px;padding:6px 10px;font-family:var(--font);}
  .sg-row:hover,.sg-row.on{background:var(--canvas);}
  .sg-row:focus-visible{outline:2px solid var(--hl);}
  .sg-name{display:block;font-family:var(--serif);font-size:14px;font-weight:600;
    color:var(--name-ink);}
  .sg-hint{display:block;font-size:11px;color:var(--ink-muted);}
  .sg-more{margin:4px 10px 6px;font-size:11px;color:var(--ink-muted);}
  .sg-head{margin:8px 10px 2px;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink-muted);}
  #login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:var(--canvas);padding:16px;box-sizing:border-box;}
  #login.hidden{display:none;}
  #login-form{width:100%;max-width:340px;background:var(--card);border-top:4px solid var(--hl);
    box-shadow:var(--shadow-card);padding:28px 24px;box-sizing:border-box;text-align:center;}
  .login-logo{display:block;width:200px;max-width:70%;margin:-8px auto 4px;mix-blend-mode:multiply;}
  #login h1{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--name-ink);}
  #login .login-hi{margin:2px 0 20px;color:var(--ink-muted);font-size:15px;}
  #login-form input{display:block;width:100%;box-sizing:border-box;font-size:17px;min-height:48px;
    padding:8px 10px;margin-top:10px;border:1px solid var(--edge);font-family:var(--font);}
  #login-form .pass-wrap{position:relative;margin-top:10px;}
  #login-form .pass-wrap input{margin-top:0;padding-right:72px;}
  #login-show{position:absolute;right:2px;top:2px;bottom:2px;min-width:64px;border:0;background:transparent;
    color:var(--hl);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);}
  #tree-pick{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;max-width:100%;}
  #village-list{position:absolute;left:0;top:calc(100% + 4px);z-index:30;min-width:11em;max-height:50vh;overflow-y:auto;
    background:var(--card);border:1px solid var(--edge);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:4px 0;}
  #village-list.hidden{display:none;}
  .village-option{display:block;width:100%;min-height:40px;padding:6px 12px;border:0;background:transparent;
    text-align:left;font-size:15px;font-family:var(--font);color:var(--ink);cursor:pointer;}
  .village-option:hover,.village-option.on{background:var(--canvas);}
  #village-picker,#family-picker{min-height:40px;padding:0 12px;border:1px solid var(--edge);border-radius:8px;
    background:var(--card);color:var(--ink);font-size:16px;font-family:var(--font);box-sizing:border-box;}
  #village-picker{width:11em;max-width:100%;color:var(--name-ink);font-weight:700;}
  #village-picker::placeholder{color:var(--ink-muted);font-weight:400;}
  #family-picker{max-width:100%;cursor:pointer;}
  #village-picker:focus,#family-picker:focus{outline:2px solid var(--hl);outline-offset:1px;}
  #sheet .edit-form{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  #sheet .edit-form label[hidden]{display:none;}
  #sheet .edit-form label{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:600;
    color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;}
  #sheet .edit-form input,#sheet .edit-form select,#sheet .edit-form textarea{font-size:15px;
    min-height:40px;padding:6px 8px;border:1px solid var(--edge);font-family:var(--font);
    text-transform:none;letter-spacing:0;color:var(--ink);background:#fff;}
  #sheet .form-buttons,#sheet .sheet-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  #sheet .form-buttons button,#sheet .sheet-actions button{min-height:44px;padding:6px 14px;
    font-size:14px;cursor:pointer;font-family:var(--font);}
  #sheet .form-msg{min-height:1.2em;color:var(--warn);font-size:13px;margin:6px 0 0;}
  #sheet .sheet-why{flex-basis:100%;margin:0;font-size:12px;color:var(--ink-muted);}
  #sheet .sheet-links{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:14px;}
  #sheet .sheet-links a{color:var(--hl);}
  #login-enter{margin-top:12px;width:100%;min-height:48px;font-size:16px;cursor:pointer;
    background:var(--hl);color:#fff;border:0;font-family:var(--font);}
  .install-app{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--edge);
    background:var(--card);color:var(--name-ink);font-size:14px;font-weight:600;cursor:pointer;
    font-family:var(--font);box-shadow:var(--shadow-card);}
  #login .install-app{margin-top:12px;width:100%;}
  .install-app.hidden{display:none;}
  #login-msg{min-height:1.4em;margin:14px 0 0;font-size:14px;color:var(--warn);}
  #refresh{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);
    background:var(--card);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;
    box-shadow:var(--shadow-card);padding:0;}
  #refresh:hover{background:var(--canvas);}

html.api-busy::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;
  background:linear-gradient(90deg,transparent,var(--living),transparent);background-size:40% 100%;
  background-repeat:no-repeat;animation:api-busy 1s linear infinite;}
html.api-busy::after{content:"Loading…";position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9999;
  padding:4px 12px;border-radius:999px;background:var(--card);color:var(--ink-muted);
  border:1px solid var(--rule);font:13px/1.4 system-ui,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.12);
  animation:api-busy-show .3s .25s both;pointer-events:none;}
@keyframes api-busy{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes api-busy-show{from{opacity:0}to{opacity:1}}

  html,body{height:auto;}
  body{display:block;overflow:auto;}
  #links{max-width:1100px;margin:0 auto;padding:16px;box-sizing:border-box;color:var(--ink);}
  #links a{color:var(--hl);}
  #links h1{font-family:var(--serif);font-size:26px;margin:8px 0 12px;color:#7A1F1F;
    display:flex;align-items:center;gap:8px;}
  #lk-form{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  #lk-form>div{flex:1 1 260px;position:relative;}
  .lk-pick{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-muted);flex:1 1 220px;}
  .lk-results{display:flex;flex-direction:column;}
  .lk-results button{min-height:44px;text-align:left;padding:6px 10px;border:1px solid var(--rule);border-top:0;
    background:var(--card);cursor:pointer;font-family:var(--font);font-size:14px;}
  .lk-results button span{color:var(--ink-muted);font-size:12px;}
  .lk-results button:hover{background:var(--canvas);}
  .lk-go{display:inline-block;min-height:44px;line-height:44px;padding:0 18px;background:var(--hl);color:#fff !important;
    text-decoration:none;border-radius:6px;font-size:16px;}
  .lk-grid{display:flex;flex-wrap:wrap;gap:12px;}
  .lk-relation{font-size:13px;font-weight:600;color:var(--hl);margin-bottom:2px;}
  .lk-pick input,.lk-pick select{min-height:44px;font-size:16px;padding:6px 10px;border:1px solid var(--edge);
    background:var(--card);font-family:var(--font);box-sizing:border-box;width:100%;}
  .lk-summary{font-family:var(--serif);font-size:19px;margin:0 0 16px;color:var(--name-ink);}
  .lk-msg{color:var(--ink-muted);}
  .lk-couples{display:flex;flex-direction:column;gap:14px;}
  .lk-couple{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .lk-card{display:flex;flex-direction:column;gap:2px;width:260px;box-sizing:border-box;padding:10px 14px;
    background:var(--card);border:1.5px solid var(--rail-unknown);border-radius:10px;box-shadow:var(--shadow-card);
    text-decoration:none;color:var(--ink) !important;}
  .lk-card.male{background:var(--card-m);border-color:var(--rail-m);}
  .lk-card.female{background:var(--card-f);border-color:var(--rail-f);}
  .lk-card b{font-family:var(--serif);font-size:17px;color:var(--name-ink);}
  .lk-hi{font-size:14px;}
  .lk-meta{font-size:13px;color:var(--ink-muted);}
  .lk-rel{font-size:13px;margin-top:4px;padding-top:4px;border-top:1px solid var(--rule);}
  .lk-married{font-size:14px;font-weight:600;color:var(--rail-f);padding:0 4px;}
  .lk-list{padding-left:18px;line-height:1.9;}
  .lk-list button{min-height:36px;border:0;background:none;color:var(--hl);text-decoration:underline;
    cursor:pointer;font-size:15px;padding:0;}
</style>
</head>
<body>
<div id="links">
  <p><a href="./">← Back to the tree</a></p>
  <h1><img class="brand-logo" src="web/icons/emblem.png" alt="">How are we linked?</h1>
  <div id="lk-form"></div>
  <main id="lk-result" aria-live="polite"></main>
</div>
<script>var FT = {};
(function (api) {
  api.base = function (hostname) {
    return hostname === 'localhost' || hostname === '127.0.0.1'
      ? 'http://localhost:5001'
      : 'https://api.jainparivar.online';
  };

  api.hindiUrl = function (text) {
    return 'https://inputtools.google.com/request?itc=hi-t-i0-und&num=1&cp=0&cs=1&ie=utf-8&oe=utf-8&app=jainparivar&text=' +
      encodeURIComponent(text);
  };

  api.firstHindi = function (reply) {
    var match = reply && reply[0] === 'SUCCESS' && reply[1] && reply[1][0];
    return (match && match[1] && match[1][0]) || '';
  };

  api.hindi = function (text) {
    if (!text) return Promise.resolve('');
    return fetch(api.hindiUrl(text)).then(function (r) { return r.json(); })
      .then(api.firstHindi, function () { return ''; });
  };

  api.pickFamily = function (requested, stored, home, villages) {
    var ids = [];
    villages.forEach(function (v) { v.families.forEach(function (f) { ids.push(f.id); }); });
    var choices = [requested, home, stored];
    for (var i = 0; i < choices.length; i++) {
      if (choices[i] && ids.indexOf(choices[i]) >= 0) return choices[i];
    }
    return ids[0] || null;
  };

  api.urlFor = function (familyId, personId) {
    return '?family=' + encodeURIComponent(familyId) +
      (personId ? '&person=' + encodeURIComponent(personId) : '');
  };

  api.who = function (p) {
    return [p.relation, p.village || 'Village not recorded'].filter(Boolean).join(' · ');
  };

  api.otherTrees = function (people, villages, currentFamily, shown) {
    var trees = {};
    villages.forEach(function (v) {
      v.families.forEach(function (f) { trees[f.id] = api.treeLabel(v, f); });
    });
    return people.filter(function (p) {
      return p.home_family !== currentFamily && !(shown && shown[p.id]);
    }).map(function (p) {
      var where = trees[p.home_family] || p.village || 'Village not recorded';
      return { id: p.id, name: p.name, name_hi: p.name_hi,
               tree: [p.relation, where].filter(Boolean).join(' · '),
               url: trees[p.home_family] ? api.urlFor(p.home_family, p.id) : null };
    });
  };

  function loadOthers(me, currentFamily) {
    if (me.guest) return;
    FT.onLink = function (a, b) { location.assign(location.pathname + api.linkTreeUrl(a, b)); };
    FT.meId = me.id;
    api.call('GET', '/directory').then(function (people) {
      FT.who = {};
      people.forEach(function (p) { FT.who[p.id] = api.who(p); });
      if (FT.renderPicks) FT.renderPicks();
      FT.otherTrees = api.otherTrees(people, api.villages || [], currentFamily, FT.byId);
    }, function () {});
  }

  api.roleText = function (me) {
    if (me.guest) return 'Guest (view only)';
    if (me.is_global) return 'Global admin';
    var scopes = me.roles.map(function (r) { return r.scope; });
    if (scopes.indexOf('family') >= 0) return 'Family tree admin';
    if (scopes.indexOf('branch') >= 0) return 'Node admin';
    if (scopes.indexOf('reader') >= 0) return 'Global reader';
    return 'Family reader';
  };

  function parse(text) {
    try { return text ? JSON.parse(text) : {}; } catch (e) { return {}; }
  }

  var pending = 0;
  function busy(change) {
    pending += change;
    var root = typeof document !== 'undefined' && document.documentElement;
    if (root) root.classList.toggle('api-busy', pending > 0);
  }

  api.call = function (method, path, body) {
    busy(1);
    return send(method, path, body).then(function (data) { busy(-1); return data; },
      function (err) { busy(-1); throw err; });
  };

  function send(method, path, body) {
    var options = { method: method, credentials: 'include', headers: {} };
    if (body !== undefined) {
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
    return fetch(api.root + path, options).then(function (r) {
      return r.text().then(function (text) {
        var data = parse(text);
        if (r.ok) return data;
        var err = new Error(data.error || ('Request failed (' + r.status + ')'));
        err.status = r.status;
        if (r.status === 401 && path !== '/login' && api.onLoggedOut) api.onLoggedOut();
        throw err;
      });
    }, function () {
      var err = new Error('Cannot reach the server. Check your internet connection.');
      err.status = 0;
      throw err;
    });
  }

  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function stored(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  api.reloadAt = function (personId) {
    location.assign(location.pathname + api.urlFor(api.familyId, personId));
  };

  function showLogin(message) {
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('login-msg').textContent = message || '';
    document.getElementById('login-user').focus();
  }

  api.togglePassword = function (input, button) {
    var reveal = input.type === 'password';
    input.type = reveal ? 'text' : 'password';
    button.textContent = reveal ? 'Hide' : 'Show';
    button.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
    button.setAttribute('aria-pressed', reveal ? 'true' : 'false');
  };

  function wireLogin() {
    var form = document.getElementById('login-form');
    var pass = document.getElementById('login-pass');
    var show = document.getElementById('login-show');
    show.addEventListener('click', function () {
      api.togglePassword(pass, show);
      pass.focus();
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = document.getElementById('login-msg');
      msg.textContent = '';
      api.call('POST', '/login', {
        username: document.getElementById('login-user').value,
        password: document.getElementById('login-pass').value
      }).then(function () { location.reload(); }, function (err) { msg.textContent = err.message; });
    });
  }

  api.treeLabel = function (village, family) {
    return village.name + ' · ' + (family.root_name || family.name);
  };

  api.treeLabelHtml = function (village, family) {
    var esc = function (s) {
      return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
    };
    return '<b>' + esc(village.name) + '</b> · ' + esc(family.root_name || family.name);
  };

  api.villageNamed = function (villages, name) {
    var key = String(name || '').trim().toLowerCase();
    return villages.filter(function (v) {
      return v.families.length && v.name.toLowerCase() === key;
    })[0] || null;
  };

  api.villagesMatching = function (villages, q) {
    var key = String(q || '').trim().toLowerCase();
    return villages.filter(function (v) {
      return v.families.length && v.name.toLowerCase().indexOf(key) >= 0;
    }).sort(function (a, b) {
      return (b.name.toLowerCase().indexOf(key) === 0) - (a.name.toLowerCase().indexOf(key) === 0) ||
        a.name.localeCompare(b.name);
    });
  };

  api.showVillage = function (vid) {
    var v = (api.villages || []).filter(function (x) { return x.id === vid; })[0];
    if (!v) return;
    api.call('GET', '/villages/' + encodeURIComponent(vid) + '/people').then(function (people) {
      people.forEach(function (p) { if (p.home_family) p.url = api.urlFor(p.home_family, p.id); });
      FT.villageGroup = { key: 'village:' + vid, kind: 'origin', name: v.name, suffix: v.state || '',
                          members: people.map(function (p) { return { person: p, owner: p }; }) };
      FT.showPlace(FT.villageGroup.key);
    }, function () {});
  };

  function familySwitcher(villages, current) {
    var pick = document.createElement('div');
    pick.id = 'tree-pick';
    var place = document.createElement('input');
    place.id = 'village-picker';
    place.setAttribute('autocomplete', 'off');
    place.setAttribute('aria-label', 'Village');
    place.setAttribute('aria-controls', 'village-list');
    var list = document.createElement('div');
    list.id = 'village-list';
    list.setAttribute('role', 'listbox');
    list.classList.add('hidden');
    var select = document.createElement('select');
    select.id = 'family-picker';
    select.setAttribute('aria-label', 'Family tree');
    var chosen = null, shown = [], active = -1;
    villages.forEach(function (v) {
      v.families.forEach(function (f) { if (f.id === current) chosen = v; });
    });

    function go(id) { location.assign(location.pathname + api.urlFor(id)); }

    function showFamilies(v) {
      chosen = v;
      place.value = v.name;
      select.innerHTML = '';
      var here = v.families.some(function (f) { return f.id === current; });
      if (!here) {
        var ask = document.createElement('option');
        ask.textContent = 'Choose family';
        ask.disabled = true;
        ask.selected = true;
        select.appendChild(ask);
      }
      v.families.forEach(function (f) {
        var option = document.createElement('option');
        option.value = f.id;
        option.textContent = f.root_name || f.name;
        option.selected = f.id === current;
        select.appendChild(option);
      });
    }

    function showList() {
      shown = api.villagesMatching(villages, place.value);
      list.innerHTML = '';
      shown.forEach(function (v, i) {
        var option = document.createElement('button');
        option.type = 'button';
        option.className = 'village-option' + (i === active ? ' on' : '');
        option.setAttribute('role', 'option');
        option.textContent = v.name;
        option.addEventListener('mousedown', function (e) { e.preventDefault(); choose(v); });
        list.appendChild(option);
      });
      if (shown.length) list.classList.remove('hidden');
      else list.classList.add('hidden');
      if (active >= 0 && list.children[active] && list.children[active].scrollIntoView) {
        list.children[active].scrollIntoView({ block: 'nearest' });
      }
    }

    function hideList() {
      list.classList.add('hidden');
      active = -1;
    }

    function choose(v) {
      hideList();
      place.value = v.name;
      if (v !== chosen) {
        location.assign(location.pathname + api.urlFor(v.families[0].id) + '&village=' + encodeURIComponent(v.id));
        return;
      }
      place.blur();
      api.showVillage(v.id);
    }

    place.addEventListener('focus', function () {
      place.placeholder = place.value || 'Village';
      place.value = '';
      active = -1;
      showList();
    });
    place.addEventListener('input', function () {
      active = -1;
      showList();
    });
    place.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && shown.length) {
        e.preventDefault(); active = (active + 1) % shown.length; showList();
      } else if (e.key === 'ArrowUp' && shown.length) {
        e.preventDefault(); active = (active <= 0 ? shown.length : active) - 1; showList();
      } else if (e.key === 'Enter' && shown.length) {
        e.preventDefault(); choose(shown[active >= 0 ? active : 0]);
      } else if (e.key === 'Escape') {
        place.blur();
      }
    });
    place.addEventListener('blur', function () {
      hideList();
      if (chosen) place.value = chosen.name;
    });
    select.addEventListener('change', function () { go(select.value); });

    if (chosen) showFamilies(chosen);
    pick.appendChild(place);
    pick.appendChild(list);
    pick.appendChild(select);
    document.querySelector('#toolbar .brand').appendChild(pick);
  }

  function menuItem(label, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'menuitem');
    b.textContent = label;
    b.addEventListener('click', onClick);
    document.getElementById('menu').appendChild(b);
  }

  function passwordSheet() {
    var body = document.getElementById('sheet-body');
    body.innerHTML = '<h3>Change password</h3><form id="pw-form" class="edit-form">' +
      '<label>Old password<input type="password" name="old" autocomplete="current-password" required></label>' +
      '<label>New password (6 digits)<input type="password" name="new" autocomplete="new-password" inputmode="numeric" ' +
      'pattern="[0-9]{6}" minlength="6" maxlength="6" required></label>' +
      '<div class="form-buttons"><button type="submit">Save</button></div>' +
      '<p class="form-msg" role="alert"></p></form>';
    document.getElementById('sheet').classList.remove('hidden');
    var form = document.getElementById('pw-form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = form.querySelector('.form-msg');
      api.call('POST', '/me/password', { old: form.elements.old.value, 'new': form.elements['new'].value })
        .then(function () { msg.textContent = 'Password changed.'; form.reset(); },
              function (err) { msg.textContent = err.message; });
    });
  }

  api.timeLeft = function (ends, nowMs) {
    var seconds = Math.floor((new Date(ends + 'Z').getTime() - nowMs) / 1000);
    if (seconds <= 0) return '';
    var s = seconds % 60;
    return Math.floor(seconds / 60) + ':' + (s < 10 ? '0' : '') + s + ' left';
  };

  function countDown(me) {
    var who = document.getElementById('who');
    var base = who.textContent;
    var timer = setInterval(function () {
      var left = api.timeLeft(me.login_ends, Date.now());
      if (left) { who.textContent = base + ' · ' + left; return; }
      clearInterval(timer);
      who.textContent = base;
      api.call('POST', '/logout', {}).catch(function () {});
      showLogin('Your temporary login has ended.');
    }, 1000);
  }

  function accountMenu(me) {
    var name = me.name || me.name_hi || me.username;
    document.getElementById('who').textContent = name + ' · ' + api.roleText(me);
    document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
    if (!me.guest) menuItem('Change password', passwordSheet);
    if (!me.guest) menuItem('Links', function () { location.assign('links.html'); });
    if (me.is_admin) menuItem('Admin', function () { location.assign('admin.html'); });
    menuItem('Log out', function () {
      api.call('POST', '/logout', {}).then(function () { location.reload(); }, function () { location.reload(); });
    });
    var version = document.createElement('p');
    version.className = 'menu-version';
    version.textContent = 'Version 1.1.0';
    document.getElementById('menu').appendChild(version);
  }

  api.linkTreeUrl = function (a, b) {
    return '?la=' + encodeURIComponent(a) + '&lb=' + encodeURIComponent(b);
  };

  api.villageTreeUrl = function (a, v) {
    return '?la=' + encodeURIComponent(a) + '&lv=' + encodeURIComponent(v);
  };

  function linkChips(first, last, note) {
    var bar = document.getElementById('picks');
    bar.innerHTML = '';
    [first, last].forEach(function (p) {
      var chip = document.createElement('span');
      chip.className = 'pick';
      chip.appendChild(document.createTextNode(p.name || p.name_hi));
      var who = document.createElement('small');
      who.className = 'pick-who';
      who.textContent = ' ' + api.who(p);
      chip.appendChild(who);
      var x = document.createElement('a');
      x.className = 'pick-x';
      x.href = './';
      x.setAttribute('aria-label', 'Back to the tree');
      x.textContent = '×';
      chip.appendChild(x);
      bar.appendChild(chip);
    });
    if (note) {
      var text = document.createElement('span');
      text.className = 'pick-note';
      text.textContent = note;
      bar.appendChild(text);
    }
    var clear = document.createElement('a');
    clear.className = 'pick-clear';
    clear.href = './';
    clear.textContent = 'Clear';
    bar.appendChild(clear);
  }

  function startLink(me, a, b, v) {
    var query = '?a=' + encodeURIComponent(a) + (v ? '&v=' + encodeURIComponent(v) : '&b=' + encodeURIComponent(b));
    return api.call('GET', '/links/tree' + query).then(function (r) {
      if (!r.found) { location.assign('./?nolink=1'); return; }
      document.getElementById('login').classList.add('hidden');
      FT.boot({ tree: r.tree, unlinked: [], summary: r.counts });
      FT.state.ends = [a, r.steps[r.steps.length - 1].id];
      FT.linkEdges = r.edges;
      FT.init();
      FT.setView('chart');
      FT.expandAll();
      accountMenu(me);
      api.onLoggedOut = function () { showLogin('Your login has ended. Please log in again.'); };
      loadOthers(me, null);
      var first = r.steps[0], last = r.steps[r.steps.length - 1];
      var note = v ? 'Closest person from ' + (last.village || 'that village') : '';
      FT.renderPicks = function () { linkChips(first, last, note); };
      FT.renderPicks();
      document.getElementById('summary').textContent = r.steps.length + ' people on this link · ' +
        'search another name to link it to ' + (first.name || first.name_hi);
    });
  }

  api.start = function () {
    api.root = api.base(location.hostname);
    wireLogin();
    api.call('GET', '/me').then(function (me) {
      api.me = me;
      if (param('la') && (param('lb') || param('lv')) && !me.guest) {
        return startLink(me, param('la'), param('lb'), param('lv'));
      }
      return api.call('GET', '/villages').then(function (villages) {
        api.villages = villages;
        var id = api.pickFamily(param('family'), stored('ft-family'), me.home_family, villages);
        if (!id) throw new Error('No family has been set up yet.');
        api.familyId = id;
        store('ft-family', id);
        return api.call('GET', '/families/' + encodeURIComponent(id) + '/tree');
      }).then(function (data) {
        document.getElementById('login').classList.add('hidden');
        FT.boot(data);
        FT.init();
        familySwitcher(api.villages, api.familyId);
        accountMenu(me);
        api.onLoggedOut = function () { showLogin('Your login has ended. Please log in again.'); };
        if (me.login_ends) countDown(me);
        loadOthers(me, api.familyId);
        if (param('village')) api.showVillage(param('village'));
        if (param('nolink')) document.getElementById('summary').textContent = 'No link found in the records between those two people.';
        var person = param('person');
        if (person) FT.openPerson(person);
        else {
          var grandfather = FT.grandfatherOf(me.id);
          if (grandfather) FT.showBranch(grandfather.id);
        }
      });
    }).catch(function (err) {
      showLogin(err.status === 401 ? '' : err.message);
    });
  };
})(typeof FT !== 'undefined' ? (FT.api = {}) : module.exports);

(function (links) {
  var state = { a: null, b: null };
  var people = [], villages = [], me = null;

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function nameOf(p) { return p.name || p.name_hi || p.id; }

  links.sentence = function (result, meId) {
    if (!result.found) return 'No link found in the records.';
    var steps = result.steps;
    if (steps.length === 1) return 'That\'s the same person.';
    var a = steps[0], b = steps[steps.length - 1];
    var whose = a.id === meId ? 'your' : nameOf(a) + '\'s';
    var hi = result.summary.hi ? ' (' + result.summary.hi + ')' : '';
    return nameOf(b) + ' is ' + whose + ' ' + result.summary.en + hi + '.';
  };

  links.parsePick = function (value) {
    if (!value) return null;
    var m = /^(p|v):(.+)$/.exec(value);
    return m ? { kind: m[1], id: m[2] } : { kind: 'p', id: value };
  };

  links.query = function (s) {
    var parts = [];
    if (s.a) parts.push('a=' + encodeURIComponent(s.a.kind + ':' + s.a.id));
    if (s.b) parts.push('b=' + encodeURIComponent(s.b.kind + ':' + s.b.id));
    return parts.length ? '?' + parts.join('&') : '';
  };

  links.matches = function (people, villages, q, limit) {
    var needle = q.trim().toLowerCase();
    if (!needle) return [];
    function rank(texts) {
      var best = null;
      texts.forEach(function (t) {
        var i = (t || '').toLowerCase().indexOf(needle);
        if (i >= 0 && (best === null || (i === 0 ? 0 : 1) < best)) best = i === 0 ? 0 : 1;
      });
      return best;
    }
    var hits = [];
    villages.forEach(function (v) {
      var r = rank([v.name]);
      if (r !== null) hits.push({ kind: 'v', item: v, rank: r });
    });
    people.forEach(function (p) {
      var r = rank([p.name, p.name_hi]);
      if (r !== null) hits.push({ kind: 'p', item: p, rank: r + 0.5 });
    });
    hits.sort(function (x, y) { return x.rank - y.rank; });
    return hits.slice(0, limit || 10);
  };

  links.who = function (p) {
    return [p.relation, p.village || 'Village not recorded'].filter(Boolean).join(' · ');
  };

  function api() { return FT.api; }

  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function find(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function item(pick) {
    return pick && find(pick.kind === 'v' ? villages : people, pick.id);
  }

  function pickText(pick) {
    var it = item(pick);
    if (!it) return '';
    return pick.kind === 'v' ? it.name + ' (village)' : nameOf(it) + ' ' + links.who(it);
  }

  function box(slot, label, key) {
    slot.innerHTML = '<label class="lk-pick"><span>' + esc(label) + '</span>' +
      '<input type="search" autocomplete="off" placeholder="Type a name or a village" value="' +
      esc(pickText(state[key])) + '"></label><div class="lk-results"></div>';
    var input = slot.querySelector('input');
    var results = slot.querySelector('.lk-results');
    input.addEventListener('focus', function () { input.select(); });
    input.addEventListener('input', function () {
      results.innerHTML = links.matches(people, villages, input.value).map(function (m) {
        var it = m.item;
        return '<button type="button" data-kind="' + m.kind + '" data-id="' + esc(it.id) + '">' +
          (m.kind === 'v'
            ? '<b>' + esc(it.name) + '</b> <span>Village</span>'
            : '<b>' + esc(nameOf(it)) + '</b> ' + (it.name && it.name_hi ? esc(it.name_hi) : '') +
              ' <span>' + esc(links.who(it)) + '</span>') + '</button>';
      }).join('');
    });
    results.addEventListener('click', function (e) {
      var b = e.target.closest('[data-id]');
      if (!b) return;
      state[key] = { kind: b.getAttribute('data-kind'), id: b.getAttribute('data-id') };
      render(true);
    });
  }

  function show(html) { document.getElementById('lk-result').innerHTML = html; }
  function fail(err) { show('<p class="lk-msg">' + esc(err.message) + '</p>'); }

  function personCard(p, href, extra) {
    var life = p.life === 'deceased' ? 'Deceased' : p.life === 'living' ? 'Living' : '';
    return '<a class="lk-card ' + esc(p.gender || '') + '" href="./' + href + '">' +
      (extra ? '<span class="lk-relation">' + esc(extra) + '</span>' : '') +
      '<b>' + esc(nameOf(p)) + '</b>' + (p.name && p.name_hi ? '<span class="lk-hi">' + esc(p.name_hi) + '</span>' : '') +
      '<span class="lk-meta">' + esc([life, 'from ' + (p.village || 'village not recorded')].filter(Boolean).join(' · ')) + '</span>' +
      (p.relation ? '<span class="lk-rel">' + esc(p.relation) + '</span>' : '') + '</a>';
  }

  function coupleHtml(c) {
    return '<div class="lk-couple">' + personCard(c.husband, api().linkTreeUrl(me.id, c.husband.id)) +
      '<span class="lk-married">married</span>' + personCard(c.wife, api().linkTreeUrl(me.id, c.wife.id)) + '</div>';
  }

  function villageLinks(vid) {
    api().call('GET', '/villages/' + encodeURIComponent(vid) + '/links').then(function (list) {
      show(list.length ? '<ul class="lk-list">' + list.map(function (v) {
        return '<li><button type="button" data-village="' + esc(v.village_id) + '">' + esc(v.village) +
          '</button> · ' + v.marriages + (v.marriages === 1 ? ' marriage' : ' marriages') + '</li>';
      }).join('') + '</ul>' : '<p class="lk-msg">No marriages with other villages are recorded.</p>');
    }, fail);
  }

  function villagePair(a, b) {
    api().call('GET', '/links/villages?a=' + encodeURIComponent(a) + '&b=' + encodeURIComponent(b)).then(function (r) {
      if (r.couples.length) { show('<div class="lk-couples">' + r.couples.map(coupleHtml).join('') + '</div>'); return; }
      if (!r.chain) { show('<p class="lk-msg">These villages are not linked in the records.</p>'); return; }
      show('<p class="lk-summary">No direct marriage. Linked through: ' +
        esc([r.chain[0].from.village].concat(r.chain.map(function (h) { return h.to.village; })).join(' → ')) +
        '</p><div class="lk-couples">' + r.chain.map(function (h) { return coupleHtml(h.couple); }).join('') + '</div>');
    }, fail);
  }

  function personVillage(pid, vid) {
    var person = find(people, pid), village = find(villages, vid);
    api().call('GET', '/links/person-village?a=' + encodeURIComponent(pid) + '&v=' + encodeURIComponent(vid))
      .then(function (list) {
        if (!list.length) { show('<p class="lk-msg">No one from ' + esc(village.name) + ' is linked to ' + esc(nameOf(person)) + ' in the records.</p>'); return; }
        var whose = pid === me.id ? 'your' : nameOf(person) + '\'s';
        show('<p class="lk-summary">' + list.length + (list.length === 1 ? ' person' : ' people') + ' from ' +
          esc(village.name) + ' linked to ' + esc(nameOf(person)) + ', closest first. Tap one to see the chart.</p>' +
          '<div class="lk-grid">' + list.map(function (p) {
            var rel = whose + ' ' + p.summary.en + (p.summary.hi ? ' (' + p.summary.hi + ')' : '');
            return personCard(p, api().linkTreeUrl(pid, p.id), rel);
          }).join('') + '</div>');
      }, fail);
  }

  function render(picked) {
    var form = document.getElementById('lk-form');
    form.innerHTML = '<div id="lk-a"></div><div id="lk-b"></div>';
    box(document.getElementById('lk-a'), 'First: person or village', 'a');
    box(document.getElementById('lk-b'), 'Second: person or village', 'b');
    history.replaceState(null, '', location.pathname + links.query(state));
    var a = state.a, b = state.b;
    if (a && b && a.kind === 'p' && b.kind === 'p') {
      if (picked) { location.assign('./' + api().linkTreeUrl(a.id, b.id)); return; }
      show('<a class="lk-go" href="./' + api().linkTreeUrl(a.id, b.id) + '">Show the link chart →</a>');
      return;
    }
    if (a && b && a.kind === 'v' && b.kind === 'v') { villagePair(a.id, b.id); return; }
    if (a && b) { var p = a.kind === 'p' ? a : b, v = a.kind === 'v' ? a : b; personVillage(p.id, v.id); return; }
    var only = a || b;
    if (only && only.kind === 'v') { villageLinks(only.id); return; }
    show('<p class="lk-msg">Pick two: two people, two villages, or a person and a village.</p>');
  }

  links.start = function () {
    api().root = api().base(location.hostname);
    api().call('GET', '/me').then(function (who) {
      me = who;
      if (me.guest) { show('<p class="lk-msg">Guest logins cannot see links.</p>'); return null; }
      state.a = links.parsePick(param('a')) || { kind: 'p', id: me.id };
      state.b = links.parsePick(param('b'));
      return Promise.all([api().call('GET', '/directory'), api().call('GET', '/villages')]).then(function (r) {
        people = r[0];
        villages = r[1].slice().sort(function (x, y) { return x.name.localeCompare(y.name); });
        document.getElementById('lk-result').addEventListener('click', function (e) {
          var b = e.target.closest('[data-village]');
          if (!b) return;
          var other = { kind: 'v', id: b.getAttribute('data-village') };
          if (state.a) state.b = other;
          else state.a = other;
          render(false);
        });
        render(false);
      });
    }).catch(function (err) {
      if (err.status === 401) location.assign('./');
      else fail(err);
    });
  };
})(typeof FT !== 'undefined' ? (FT.links = {}) : module.exports);

FT.links.start();</script>
