<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree</title>
<style>:root{
  --canvas:#FAF8F5;
  --card:#FFFFFF;
  --edge:#E8E2DA;
  --rail-m:#2F4A7C;
  --rail-f:#A8446B;
  --rail-unknown:#A2917D;
  --ink:#1F2933;
  --ink-muted:#7A6E63;
  --living:#3F8F5E;
  --connector:#C8BDB0;
  --bark:#7A5C3E;
  --bark-trunk:#5E4530;
  --leaf-1:#7FA96A;
  --leaf-2:#9CBE7E;
  --leaf-3:#C2D6A0;
  --leaf-spouse:#E7C4D3;
  --hl:#D3722F;
  --warn:#C0392B;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI",sans-serif;
  --shadow-card:0 1px 2px rgba(60,45,30,.06),0 3px 8px rgba(60,45,30,.05);
}
  html,body{margin:0;height:100%;font-family:var(--font);}
  body{display:flex;flex-direction:column;background:var(--canvas);}
  #toolbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:6px 12px;background:var(--card);border-bottom:1px solid var(--edge);
    box-shadow:var(--shadow-card);z-index:10;box-sizing:border-box;
    font-size:13px;font-weight:500;color:var(--ink);}
  #toolbar input{padding:6px 8px;flex:1 1 140px;min-width:0;max-width:260px;font-size:16px;min-height:44px;
    border:1px solid var(--edge);font-family:var(--font);}
  #toolbar button{padding:6px 10px;cursor:pointer;font-size:14px;}
  #toolbar .summary{width:100%;font-size:12px;color:var(--ink-muted);}
  #stage{flex:1 1 auto;position:relative;overflow:hidden;background:var(--canvas);
    cursor:grab;touch-action:none;}
  #stage.grabbing{cursor:grabbing;}
  svg{width:100%;height:100%;display:block;}
  .edge{fill:none;stroke:var(--connector);stroke-width:1.25px;}
  .edge.hl{stroke:var(--hl);stroke-width:2.5px;}
  .branch{fill:none;stroke:var(--bark);stroke-linecap:round;}
  .branch.trunk{stroke-width:16px;stroke:var(--bark-trunk);}
  .branch.hl{stroke:var(--hl);}
  .leaf{fill:var(--leaf-1);stroke:var(--leaf-2);stroke-width:1px;cursor:pointer;}
  .leaf.spouseleaf{fill:var(--leaf-spouse);stroke:var(--rail-f);}
  .leafnode.hl .leaf{stroke:var(--hl);stroke-width:2.5px;}
  .leaflabel{font-size:11px;fill:var(--ink);pointer-events:none;}
  #stage.hide-labels .leaflabel{display:none;}
  .toggle{fill:var(--rail-m);cursor:pointer;pointer-events:none;}
  .toggle-hit{fill:transparent;cursor:pointer;pointer-events:all;}
  #unlinked{position:absolute;right:0;top:0;width:230px;max-width:70%;max-height:45%;overflow:auto;background:var(--card);
    border-left:1px solid var(--edge);border-bottom:1px solid var(--edge);padding:8px;font-size:12px;z-index:5;box-sizing:border-box;}
  #unlinked h4{margin:0 0 6px;}
  #unlinked.empty{display:none;}
  .card-bg{fill:var(--card);stroke:var(--edge);stroke-width:1px;}
  .card-shadow{fill:var(--ink);opacity:.09;pointer-events:none;}
  .card-hit{fill:transparent;pointer-events:all;}
  .card-name{font-size:13.5px;font-weight:600;fill:var(--ink);pointer-events:none;}
  .card-meta{font-size:11px;fill:var(--ink-muted);pointer-events:none;}
  .living-dot{fill:var(--living);pointer-events:none;}
  .card-row{cursor:pointer;}
  .card-row.unfilled{cursor:default;}
  .card-row.unfilled .card-name{fill:var(--ink-muted);font-style:italic;font-weight:400;}
  .card-row.deceased .card-rail{opacity:.7;}
  .card-row.deceased .card-name{fill:var(--ink-muted);}
  .card-row.uncertain .card-name{fill:var(--warn);}
  .card.hl .card-bg{stroke:var(--hl);stroke-width:2px;}
  .avatar{pointer-events:none;}
  #sheet{position:absolute;right:0;top:0;bottom:0;width:320px;background:var(--card);
    border-left:1px solid var(--edge);box-shadow:var(--shadow-card);
    padding:16px;overflow:auto;z-index:20;box-sizing:border-box;font-size:13px;color:var(--ink);}
  #sheet.hidden{display:none;}
  #sheet-close{position:absolute;right:8px;top:8px;width:44px;height:44px;
    border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--ink-muted);}
  .sheet-photo{display:block;width:96px;height:96px;border-radius:50%;
    object-fit:cover;margin:0 auto 10px;border:1px solid var(--edge);}
  #sheet h3{margin:0 0 2px;text-align:center;font-size:17px;font-weight:600;color:var(--ink);}
  .sheet-hi{margin:0 0 12px;text-align:center;color:var(--ink-muted);}
  #sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;}
  #sheet dt{color:var(--ink-muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
  #sheet dd{margin:0;font-size:13px;color:var(--ink);}
  .sheet-rel{margin-top:12px;padding-top:10px;border-top:1px solid var(--edge);line-height:1.9;}
  .sheet-rel span{color:var(--ink-muted);margin-right:4px;}
  .sheet-rel a{color:var(--rail-m);text-decoration:none;}
  #view-picker{padding:8px;font-size:16px;min-height:44px;max-width:180px;}
  #toolbar button{min-height:44px;min-width:44px;}
  #more{display:none;}
  @media (max-width:768px){
    #sheet{right:0;left:0;top:auto;bottom:0;width:auto;max-height:60%;
      border-left:0;border-top:1px solid var(--edge);border-radius:12px 12px 0 0;
      box-shadow:var(--shadow-card);}
    #more{display:inline-block;}
    #extras{display:none;width:100%;}
    #toolbar.show-extras #extras{display:flex;gap:8px;flex-wrap:wrap;}
    #toolbar .summary{font-size:11px;}
  }
</style>
</head>
<body>
<div id="toolbar">
  <select id="view-picker" aria-label="Tree view"></select>
  <input id="search" placeholder="Search name, press Enter" autocomplete="off">
  <button id="more" aria-label="More options">⋯</button>
  <span id="extras">
    <button data-lang="both">EN+हिं</button>
    <button data-lang="en">EN</button>
    <button data-lang="hi">हिं</button>
    <button id="reset">Fit to screen</button>
  </span>
  <span class="summary" id="summary"></span>
</div>
<div id="stage"><svg><g id="viewport"></g></svg></div>
<div id="unlinked"></div>
<div id="sheet" class="hidden">
  <button id="sheet-close" aria-label="Close">×</button>
  <div id="sheet-body"></div>
</div>

    return [];
  };
  FT.hash01 = function (s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return ((h >>> 0) % 10000) / 10000;
  };
  FT.leafCount = function (n) {
    var kids = FT.visibleChildren(n);
    if (!kids.length) return 1;
    return kids.reduce(function (sum, c) { return sum + FT.leafCount(c); }, 0);
  };
  FT.rows = function (n) {
    var partners = FT.partners(n).length;
    return 1 + partners;
  };
  FT.nodeW = function () { return FT.CARD_W; };
  FT.nodeH = function (n) { return FT.rows(n) * FT.ROW_H; };
  FT.jointX = function () {
    var view = FT.views[FT.state.viewId];
    return view && view.nodeShape === 'leaf' ? 0 : FT.CARD_W / 2;
  };
  FT.jointY = function (n) { return FT.nodeH(n); };

  FT.visibleChildren = function (n) {
    return FT.state.collapsed[n.id] ? [] : (n.children || []);
  };

  FT.metaLine = function (p) {
    var parts = [];
    if (FT.state.lang !== 'en' && p.name_hi) parts.push(p.name_hi);
    var span = FT.lifespan(p);
    if (span) parts.push(span);
    return { text: parts.join(' · '), dot: p.life === 'living' && !p.died };
  };

  FT.lifespan = function (p) {
    if (p.born && p.died) return p.born + '–' + p.died;
    if (p.born && p.life === 'deceased') return p.born + '–Deceased';
    if (p.born && p.life === 'living') return p.born + '–Living';
    if (p.born) return 'b. ' + p.born;
    if (p.died) return 'd. ' + p.died;
    if (p.life === 'living') return 'Living';
    if (p.life === 'deceased') return 'Deceased';
    return '';
  };

  FT.label = function (p) {
    var lang = FT.state.lang;
    if (lang === 'en') return [p.name || p.name_hi || p.id];
    if (lang === 'hi') return [p.name_hi || p.name || p.id];
    var out = [];
    if (p.name) out.push(p.name);
    if (p.name_hi) out.push(p.name_hi);
    return out.length ? out : [p.id];
  };

  var ADDRESS_ROWS = [
    ['line', 'Address'], ['locality', 'Locality'], ['city', 'City'],
    ['state', 'State'], ['country', 'Country']
  ];

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function personRef(id) {
    var n = FT.byId[id];
    var label = n ? (FT.label(n)[0]) : id;
    return '<a href="#" data-goto="' + esc(id) + '">' + esc(label) + '</a>';
  }

  function spouseRef(s, owner) {
    return '<a href="#" data-spouse="' + esc(s.id) + '" data-owner="' + esc(owner.id) + '">' +
      esc(FT.label(s)[0]) + '</a>';
  }

  function sheetHtml(p, owner) {
    var h = '';
    if (p.photo) h += '<img class="sheet-photo" src="' + esc(p.photo) + '" alt="">';
    if (p.name) h += '<h3>' + esc(p.name) + '</h3>';
    if (p.name_hi) h += '<p class="sheet-hi">' + esc(p.name_hi) + '</p>';
    var rows = '';
    if (p.born) rows += '<dt>Born</dt><dd>' + esc(p.born) + '</dd>';
    ADDRESS_ROWS.forEach(function (r) {
      var v = (p.address || {})[r[0]];
      if (v) rows += '<dt>' + r[1] + '</dt><dd>' + esc(v) + '</dd>';
    });
    if (p.note) rows += '<dt>Note</dt><dd>' + esc(p.note) + '</dd>';
    if (rows) h += '<dl>' + rows + '</dl>';

    var rel = '';
    var parent = FT.parentOf[owner.id];
    if (parent) rel += '<div><span>Parent</span> ' + personRef(parent.id) + '</div>';
    if (owner.spouses && owner.spouses.length) {
      rel += '<div><span>Spouse</span> ' +
        owner.spouses.map(function (s) { return spouseRef(s, owner); }).join(', ') + '</div>';
    } else if (owner.placeholder) {
      rel += '<div><span>Spouse</span> <em>not recorded</em></div>';
    }
    var kids = owner.children || [];
    if (kids.length) {
      rel += '<div><span>Children</span> ' +
        kids.map(function (c) { return personRef(c.id); }).join(', ') + '</div>';
    }
    if (rel) h += '<div class="sheet-rel">' + rel + '</div>';
    return h;
  }

  var sheet = document.getElementById('sheet');
  var sheetBody = document.getElementById('sheet-body');

  FT.closeSheet = function () {
    sheet.classList.add('hidden');
    FT.state.selected = null;
    FT.state.highlighted = null;
  };

  FT.select = function (id, owner) {
    var node = owner || FT.byId[id];
    if (!node) return;
    var person = node.id === id ? node :
      (node.spouses || []).filter(function (s) { return s.id === id; })[0] || node;
    FT.state.selected = id;
    FT.state.highlighted = node.id;
    highlight(node.id);
    sheetBody.innerHTML = sheetHtml(person, node);
    sheet.classList.remove('hidden');
  };

  FT.focus = function (id) {
    var n = FT.byId[id];
    if (!n) return;
    var c = FT.parentOf[id];
    while (c) { FT.state.collapsed[c.id] = false; c = FT.parentOf[c.id]; }
    FT.render();
    var r = stage.getBoundingClientRect();
    tx = r.width / 2 - (n.x + FT.jointX(n)) * scale;
    ty = r.height / 2 - n.y * scale;
    apply();
    FT.select(id, n);
  };

  document.getElementById('sheet-close').addEventListener('click', FT.closeSheet);
  sheetBody.addEventListener('click', function (e) {
    var sp = e.target.closest('[data-spouse]');
    if (sp) {
      e.preventDefault();
      var owner = FT.byId[sp.getAttribute('data-owner')];
      if (owner) FT.select(sp.getAttribute('data-spouse'), owner);
      return;
    }
    var a = e.target.closest('[data-goto]');
    if (!a) return;
    e.preventDefault();
    FT.focus(a.getAttribute('data-goto'));
  });

  function fitText(t, avail) {
    var full = t.getComputedTextLength();
    if (full <= avail) return;
    var s = t.textContent;
    var keep = Math.max(1, Math.floor(s.length * avail / full) - 1);
    t.textContent = s.slice(0, keep) + '…';
    while (keep > 1 && t.getComputedTextLength() > avail) {
      keep -= 1;
      t.textContent = s.slice(0, keep) + '…';
    }
  }

  function drawRow(parent, p, rowIndex, owner) {
    var y = rowIndex * FT.ROW_H;
    var unfilled = !p.id;
    var cls = 'card-row' + (unfilled ? ' unfilled' : '') +
      (p.died || p.life === 'deceased' ? ' deceased' : '') +
      (p.status === 'uncertain' ? ' uncertain' : '');
    var g = el('g', { 'class': cls, transform: 'translate(0,' + y + ')' }, parent);
    el('rect', {
      'class': 'card-hit', x: 0, y: 0, width: FT.CARD_W, height: FT.ROW_H
    }, g);
    el('rect', {
      'class': 'card-rail', x: 0, y: 0, width: FT.RAIL_W, height: FT.ROW_H,
      fill: unfilled ? 'var(--rail-unknown)'
        : (p.gender === 'female' ? 'var(--rail-f)' : 'var(--rail-m)')
    }, g);
    var textX = FT.RAIL_W + 12;
    if (p.photo) {
      var img = el('image', {
        href: p.photo, x: textX, y: (FT.ROW_H - FT.AVATAR) / 2,
        width: FT.AVATAR, height: FT.AVATAR,
        preserveAspectRatio: 'xMidYMid slice',
        'clip-path': 'inset(0 round 50%)', 'class': 'avatar'
      }, g);
      img.addEventListener('error', function () { g.removeChild(img); });
      textX += FT.AVATAR + 10;
    }
    var name = el('text', { 'class': 'card-name', x: textX, y: 21 }, g);
    name.textContent = unfilled ? 'Unknown' : FT.label(p)[0];
    fitText(name, FT.CARD_W - textX - 10);
    var meta = FT.metaLine(p);
    if (meta.dot) {
      el('circle', { 'class': 'living-dot', cx: textX + 3, cy: 34, r: 3 }, g);
    }
    if (meta.text) {
      var metaX = textX + (meta.dot ? 12 : 0);
      var m = el('text', { 'class': 'card-meta', x: metaX, y: 38 }, g);
      m.textContent = meta.text;
      fitText(m, FT.CARD_W - metaX - 10);
    }
    if (!unfilled) {
      g.addEventListener('click', function (ev) {
        ev.stopPropagation();
        FT.select(p.id, owner);
      });
    }
    return g;
  }

  FT.drawLeaf = function (parent, n) {
    var g = el('g', {
      'class': 'leafnode' + (FT.hasPartner(n) ? ' paired' : ''),
      'data-id': n.id, transform: 'translate(' + n.x + ',' + n.y + ')'
    }, parent);
    var r = 7 + Math.min(6, Math.sqrt(FT.leafCount(n)));
    el('ellipse', { rx: r, ry: r * 0.72, 'class': 'leaf' }, g);
    if (FT.hasPartner(n)) {
      el('ellipse', { cx: r * 1.5, rx: r * 0.8, ry: r * 0.6, 'class': 'leaf spouseleaf' }, g);
    }
    var t = el('text', { y: -r - 5, 'text-anchor': 'middle', 'class': 'leaflabel' }, g);
    t.textContent = FT.label(n)[0];
    g.addEventListener('click', function () { FT.select(n.id, n); });
    return g;
  };

  FT.drawNode = function (parent, n) {
    var view = FT.views[FT.state.viewId];
    if (view && view.nodeShape === 'leaf') return FT.drawLeaf(parent, n);
    var g = el('g', {
      'class': 'card', 'data-id': n.id,
      transform: 'translate(' + n.x + ',' + n.y + ')'
    }, parent);
    el('rect', {
      'class': 'card-shadow', y: 3, width: FT.CARD_W, height: FT.nodeH(n), rx: 8
    }, g);
    el('rect', {
      'class': 'card-bg', width: FT.CARD_W, height: FT.nodeH(n), rx: 8
    }, g);
    drawRow(g, n, 0, n);
    FT.partners(n).forEach(function (p, i) { drawRow(g, p, i + 1, n); });
    if ((n.children || []).length) {
      var cx = FT.jointX(n), cy = FT.jointY(n) + 8;
      var hit = el('circle', { 'class': 'toggle-hit', cx: cx, cy: cy, r: 22 }, g);
      el('circle', { 'class': 'toggle', cx: cx, cy: cy, r: 11 }, g);
      hit.addEventListener('click', function (ev) {
        ev.stopPropagation();
        FT.state.collapsed[n.id] = !FT.state.collapsed[n.id];
        FT.render();
      });
    }
    g.addEventListener('click', function () { FT.select(n.id, n); });
    return g;
  };

  FT.render = function () {
    while (vp.firstChild) vp.removeChild(vp.firstChild);
    var view = FT.views[FT.state.viewId] || FT.views.classic;
    view.layout(tree);
    var edges = el('g', {}, vp);
    var nodes = el('g', {}, vp);
    view.drawEdges(edges, tree);
    (function walk(n) {
      FT.drawNode(nodes, n);
      FT.visibleChildren(n).forEach(walk);
    })(tree);
    if (FT.state.highlighted) highlight(FT.state.highlighted);
    apply();
  };

  function clearHl(){
    var hl=vp.querySelectorAll('.hl');
    for(var i=0;i<hl.length;i++) hl[i].classList.remove('hl');
  }
  function highlight(id){
    clearHl();
    var cur=id;
    while(cur){
      var node=vp.querySelector('[data-id="'+CSS.escape(cur)+'"]');
      if(node) node.classList.add('hl');
      var edge=vp.querySelector('.edge[data-edge="'+CSS.escape(cur)+'"]');
      if(edge) edge.classList.add('hl');
      cur=FT.parentOf[cur]?FT.parentOf[cur].id:null;
    }
  }

  var tx=40, ty=20, scale=1, dragging=false, lx=0, ly=0;
  function apply(){
    vp.setAttribute('transform','translate('+tx+','+ty+') scale('+scale+')');
    stage.classList.toggle('hide-labels', scale < 1.2);
  }
  stage.addEventListener('mousedown',function(e){ dragging=true; lx=e.clientX; ly=e.clientY; stage.classList.add('grabbing'); });
  window.addEventListener('mousemove',function(e){ if(!dragging) return; tx+=e.clientX-lx; ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; apply(); });
  window.addEventListener('mouseup',function(){ dragging=false; stage.classList.remove('grabbing'); });
  stage.addEventListener('wheel',function(e){
    e.preventDefault();
    var f=e.deltaY<0?1.1:1/1.1;
    var r=stage.getBoundingClientRect();
    var mx=e.clientX-r.left, my=e.clientY-r.top;
    tx=mx-(mx-tx)*f; ty=my-(my-ty)*f; scale*=f; apply();
  }, {passive:false});

  // touch: one finger pans, two fingers pinch-zoom
  function tdist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
  var touch=null;
  stage.addEventListener('touchstart',function(e){
    if(e.touches.length===1){ touch={mode:'pan', x:e.touches[0].clientX, y:e.touches[0].clientY}; }
    else if(e.touches.length===2){ touch={mode:'pinch', d:tdist(e.touches),
      cx:(e.touches[0].clientX+e.touches[1].clientX)/2, cy:(e.touches[0].clientY+e.touches[1].clientY)/2}; }
  }, {passive:false});
  stage.addEventListener('touchmove',function(e){
    if(!touch) return;
    e.preventDefault();
    if(touch.mode==='pan' && e.touches.length===1){
      tx+=e.touches[0].clientX-touch.x; ty+=e.touches[0].clientY-touch.y;
      touch.x=e.touches[0].clientX; touch.y=e.touches[0].clientY; apply();
    } else if(touch.mode==='pinch' && e.touches.length===2){
      var nd=tdist(e.touches); if(!touch.d){ touch.d=nd; return; }
      var f=nd/touch.d, r=stage.getBoundingClientRect();
      var mx=touch.cx-r.left, my=touch.cy-r.top;
      tx=mx-(mx-tx)*f; ty=my-(my-ty)*f; scale*=f; touch.d=nd; apply();
    }
  }, {passive:false});
  stage.addEventListener('touchend',function(e){ if(e.touches.length===0) touch=null; });

  var VIEW_ORDER = ['classic', 'horizontal', 'organic'];

  FT.setView = function (id) {
    if (!FT.views[id]) return;
    FT.state.viewId = id;
    try { localStorage.setItem('ft-view', id); } catch (e) {}
    document.getElementById('view-picker').value = id;
    FT.render();
    FT.fit();
  };

  FT.fit = function () {
    var view = FT.views[FT.state.viewId];
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    (function walk(n) {
      var w = view.nodeShape === 'leaf' ? 30 : FT.nodeW(n);
      var h = view.nodeShape === 'leaf' ? 30 : FT.nodeH(n);
      minX = Math.min(minX, n.x - w / 2); maxX = Math.max(maxX, n.x + w);
      minY = Math.min(minY, n.y - h / 2); maxY = Math.max(maxY, n.y + h);
      FT.visibleChildren(n).forEach(walk);
    })(tree);
    if (view.nodeShape === 'leaf') {
      minX = Math.min(minX, -10); maxX = Math.max(maxX, 10);
      minY = Math.min(minY, 30); maxY = Math.max(maxY, 50);
    }
    var r = stage.getBoundingClientRect();
    var stageW = r.width > 0 ? r.width : window.innerWidth;
    var stageH = r.height > 0 ? r.height : window.innerHeight;
    var pad = 40;
    scale = Math.min(
      (stageW - pad * 2) / Math.max(1, maxX - minX),
      (stageH - pad * 2) / Math.max(1, maxY - minY)
    );
    scale = Math.min(scale, 1.2);
    tx = pad - minX * scale + (stageW - pad * 2 - (maxX - minX) * scale) / 2;
    ty = pad - minY * scale + (stageH - pad * 2 - (maxY - minY) * scale) / 2;
    apply();
  };

  function populateViewPicker() {
    var sel = document.getElementById('view-picker');
    VIEW_ORDER.forEach(function (id) {
      if (!FT.views[id]) return;
      var o = document.createElement('option');
      o.value = id;
      o.textContent = FT.views[id].label;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () { FT.setView(sel.value); });
  }

  document.getElementById('more').addEventListener('click', function () {
    document.getElementById('toolbar').classList.toggle('show-extras');
  });

  document.getElementById('search').addEventListener('keydown',function(e){
    if(e.key!=='Enter') return;
    var q=e.target.value.trim().toLowerCase(); if(!q) return;
    var hit=null;
    for(var i=0;i<FT.nodes.length;i++){
      var n=FT.nodes[i];
      if(((n.name||'')+(n.name_hi||'')).toLowerCase().indexOf(q)>=0){ hit=n; break; }
    }
    if(!hit) return;
    scale=1;
    FT.focus(hit.id);
  });

  var langBtns=document.querySelectorAll('#toolbar [data-lang]');
  for(var i=0;i<langBtns.length;i++){
    langBtns[i].addEventListener('click', (function(b){ return function(){ FT.state.lang=b.getAttribute('data-lang'); FT.render(); }; })(langBtns[i]));
  }
  document.getElementById('reset').addEventListener('click', FT.fit);

  document.getElementById('summary').textContent=
    'People '+summary.total+' · Generations '+summary.generations+
    ' · Uncertain '+summary.uncertain+' · Needs-parent '+summary.needs_parent;

  var up=document.getElementById('unlinked');
  if(unlinked.length){
    var html='<h4>Unlinked — to place</h4>';
    unlinked.forEach(function(p){
      html+='<div>• '+esc(p.name||p.name_hi||p.id)+(p.note?' <em>('+esc(p.note)+')</em>':'')+'</div>';
    });
    up.innerHTML=html;
  } else {
    up.className='empty';
  }

  FT.init = function () {
    populateViewPicker();
    var saved = null;
    try { saved = localStorage.getItem('ft-view'); } catch (e) {}
    var preferred = saved && FT.views[saved]
      ? saved
      : (window.innerWidth < 768 ? 'horizontal' : 'classic');
    FT.setView(preferred);
  };
})();

FT.views.classic = {
  id: 'classic',
  label: 'Classic (top-down)',
  nodeShape: 'box',
  layout: function (root) {
    var slot = FT.CARD_W + FT.H_GAP;
    var rowHeight = [];
    (function measure(n, depth) {
      rowHeight[depth] = Math.max(rowHeight[depth] || 0, FT.nodeH(n));
      FT.visibleChildren(n).forEach(function (c) { measure(c, depth + 1); });
    })(root, 0);
    var rowTop = [0];
    for (var d = 0; d < rowHeight.length; d++) {
      rowTop[d + 1] = rowTop[d] + rowHeight[d] + FT.V_GAP;
    }
    var cursor = 0;
    (function place(n, depth) {
      n.depth = depth;
      n.y = rowTop[depth];
      var kids = FT.visibleChildren(n);
      if (!kids.length) {
        n.x = cursor + slot / 2 - FT.jointX(n);
        cursor += slot;
        return;
      }
      kids.forEach(function (c) { place(c, depth + 1); });
      var first = kids[0], last = kids[kids.length - 1];
      var mid = (first.x + FT.jointX(first) + last.x + FT.jointX(last)) / 2;
      n.x = mid - FT.jointX(n);
    })(root, 0);
  },
  drawEdges: function (g, root) {
    (function walk(n) {
      var kids = FT.visibleChildren(n);
      if (!kids.length) return;
      var jx = n.x + FT.jointX(n), jy = n.y + FT.jointY(n);
      var busY = jy + FT.V_GAP / 2;
      FT.edge(g, 'M' + jx + ',' + jy + ' V' + busY);
      var xs = kids.map(function (c) { return c.x + FT.jointX(c); });
      FT.edge(g, 'M' + Math.min.apply(null, xs) + ',' + busY +
                 ' H' + Math.max.apply(null, xs));
      kids.forEach(function (c) {
        FT.edge(g, 'M' + (c.x + FT.jointX(c)) + ',' + busY +
                   ' V' + c.y, c.id);
        walk(c);
      });
    })(root);
  }
};

FT.views.horizontal = {
  id: 'horizontal',
  label: 'Left to right',
  nodeShape: 'box',
  layout: function (root) {
    var cursor = 0;
    var COL = FT.CARD_W + 90;
    function shiftDown(n, dy) {
      n.y += dy;
      FT.visibleChildren(n).forEach(function (c) { shiftDown(c, dy); });
    }
    (function place(n, depth) {
      n.depth = depth;
      n.x = depth * COL;
      var kids = FT.visibleChildren(n);
      if (!kids.length) {
        n.y = cursor;
        cursor += FT.nodeH(n) + 18;
        return;
      }
      var subtreeTop = cursor;
      kids.forEach(function (c) { place(c, depth + 1); });
      var first = kids[0], last = kids[kids.length - 1];
      n.y = (first.y + FT.jointY(first) + last.y + FT.jointY(last)) / 2 - FT.jointY(n);
      var dy = 0;
      if (n.y < subtreeTop) {
        dy = subtreeTop - n.y;
        kids.forEach(function (c) { shiftDown(c, dy); });
        n.y = subtreeTop;
      }
      cursor = Math.max(cursor + dy, n.y + FT.nodeH(n) + 18);
    })(root, 0);
  },
  drawEdges: function (g, root) {
    (function walk(n) {
      var kids = FT.visibleChildren(n);
      if (!kids.length) return;
      var jx = n.x + FT.nodeW(n), jy = n.y + FT.jointY(n);
      var busX = jx + 45;
      FT.edge(g, 'M' + jx + ',' + jy + ' H' + busX);
      var ys = kids.map(function (c) { return c.y + FT.jointY(c); });
      FT.edge(g, 'M' + busX + ',' + Math.min.apply(null, ys) +
                 ' V' + Math.max.apply(null, ys));
      kids.forEach(function (c) {
        FT.edge(g, 'M' + busX + ',' + (c.y + FT.jointY(c)) + ' H' + c.x, c.id);
        walk(c);
      });
    })(root);
  }
};

FT.views.organic = {
  id: 'organic',
  label: 'Tree (organic)',
  nodeShape: 'leaf',
  layout: function (root) {
    var SPREAD = 150 * Math.PI / 180;
    var TRUNK = 120;
    var RING = 115;
    (function place(n, a0, a1, depth) {
      n.depth = depth;
      var mid = (a0 + a1) / 2;
      var wobble = (FT.hash01(n.id) - 0.5) * (a1 - a0) * 0.25;
      var ang = mid + wobble;
      var r = TRUNK + depth * RING;
      n.ang = ang;
      n.x = r * Math.sin(ang);
      n.y = -r * Math.cos(ang);
      var kids = FT.visibleChildren(n);
      if (!kids.length) return;
      var total = kids.reduce(function (s, c) { return s + FT.leafCount(c); }, 0);
      var cur = a0;
      kids.forEach(function (c) {
        var share = (a1 - a0) * (FT.leafCount(c) / total);
        place(c, cur, cur + share, depth + 1);
        cur += share;
      });
    })(root, -SPREAD / 2, SPREAD / 2, 0);
  },
  drawEdges: function (g, root) {
    FT.edge(g, 'M0,40 L' + root.x + ',' + root.y).setAttribute(
      'class', 'branch trunk'
    );
    (function walk(n) {
      FT.visibleChildren(n).forEach(function (c) {
        var cx = n.x + (c.x - n.x) * 0.35 + Math.sin(n.ang) * 20;
        var cy = n.y + (c.y - n.y) * 0.35 - Math.cos(n.ang) * 20;
        var p = FT.edge(g,
          'M' + n.x + ',' + n.y + ' Q' + cx + ',' + cy + ' ' + c.x + ',' + c.y, c.id);
        p.setAttribute('class', 'edge branch');
        p.style.strokeWidth = Math.max(1.5, Math.sqrt(FT.leafCount(c)) * 1.8) + 'px';
        walk(c);
      });
    })(root);
  }
};

FT.init();</script>
