<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Roots</title>
<style>:root{
  --canvas:#F7F2E4;
  --card:#FFFDF7;
  --edge:#B9C6A4;
  --rule:#DEE4CC;
  --rail-m:#4A6FA5;
  --rail-f:#C4708A;
  --rail-unknown:#A89880;
  --card-m:#EEF3FA;
  --card-f:#FBEFF3;
  --ink:#3A3A2E;
  --ink-muted:#6F6A57;
  --name-ink:#234A21;
  --living:#4A8C4A;
  --connector:#A8935F;
  --bark:#8A6240;
  --bark-trunk:#6B4A2E;
  --leaf-1:#6F9C52;
  --leaf-2:#8FBA6C;
  --leaf-3:#BCD79C;
  --leaf-spouse:#E7C4D3;
  --hl:#C86B2A;
  --warn:#B5432F;
  --band:#EFE7D2;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI",sans-serif;
  --serif:"Iowan Old Style",Georgia,"Times New Roman","Noto Serif Devanagari",serif;
  --shadow-card:0 1px 2px rgba(70,60,30,.07),0 4px 10px rgba(70,60,30,.06);
}
  html,body{margin:0;height:100%;font-family:var(--font);}
  body{display:flex;flex-direction:column;background:var(--canvas);}
  #toolbar{flex:0 0 auto;position:relative;padding:12px 16px 0;background:var(--card);
    border-bottom:1px solid var(--edge);box-shadow:var(--shadow-card);z-index:10;
    box-sizing:border-box;font-size:13px;font-weight:500;color:var(--ink);}
  #toolbar .top-row{display:flex;align-items:center;gap:10px;}
  #toolbar .brand{flex:1 1 auto;min-width:0;}
  #toolbar .title{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;
    line-height:1.15;color:var(--ink);}
  #toolbar .who{margin:2px 0 0;min-height:1.3em;font-size:13px;color:var(--ink-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #top-actions{display:flex;gap:8px;}
  .menu-wrap{position:relative;}
  #avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--card);
    box-shadow:0 0 0 1px var(--edge);background:var(--name-ink);color:#fff;cursor:pointer;
    font-family:var(--serif);font-size:19px;font-weight:600;padding:0;}
  #menu{position:absolute;right:0;top:52px;min-width:220px;background:var(--card);
    border:1px solid var(--edge);border-radius:10px;box-shadow:var(--shadow-card);
    padding:6px;z-index:40;}
  #menu.hidden{display:none;}
  #menu button{display:block;width:100%;min-height:44px;text-align:left;padding:8px 12px;
    background:none;border:0;border-radius:7px;font-family:var(--font);font-size:15px;
    color:var(--ink);cursor:pointer;}
  #menu button:hover{background:var(--canvas);}
  #toolbar .search-row{position:relative;max-width:680px;margin:12px auto 0;}
  #toolbar .search-icon{position:absolute;left:14px;top:12px;width:20px;height:20px;
    fill:none;stroke:var(--ink-muted);stroke-width:2;stroke-linecap:round;pointer-events:none;}
  #search{width:100%;box-sizing:border-box;min-height:46px;padding:8px 16px 8px 44px;
    border:1px solid var(--edge);border-radius:999px;background:var(--canvas);
    font-size:16px;font-family:var(--font);color:var(--ink);}
  #search:focus{outline:2px solid var(--hl);outline-offset:1px;background:var(--card);}
  #toolbar .search-hint{margin:4px 0 0;text-align:center;font-size:12px;color:var(--ink-muted);}
  #picks:not(:empty){display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;}
  #toolbar .summary{margin:10px -16px 0;padding:8px 16px;background:var(--band);
    border-top:1px solid var(--edge);font-size:13px;line-height:1.5;color:var(--ink);}
  #toolbar .summary b{font-weight:700;}
  #stage{flex:1 1 auto;position:relative;overflow:hidden;background:var(--canvas);
    cursor:grab;touch-action:none;}
  #stage.grabbing{cursor:grabbing;}
  svg{width:100%;height:100%;display:block;}
  .edge{fill:none;stroke:var(--connector);stroke-width:1.25px;}
  .edge.branch{stroke:var(--bark);stroke-linecap:round;}
  .edge.branch.hl{stroke:var(--hl);}
  .edge.hl{stroke:var(--hl);stroke-width:2.5px;}
  .toggle{fill:var(--card);stroke:var(--bark);stroke-width:2px;cursor:pointer;
    pointer-events:none;}
  .toggle-sign{font-size:15px;font-weight:700;fill:var(--bark);font-family:var(--font);
    cursor:pointer;pointer-events:none;}
  .toggle-hit{fill:transparent;cursor:pointer;pointer-events:all;}
  #unlinked{position:absolute;right:0;top:0;width:230px;max-width:70%;max-height:45%;overflow:auto;background:var(--card);
    border-left:1px solid var(--edge);border-bottom:1px solid var(--edge);padding:8px;font-size:12px;z-index:5;box-sizing:border-box;}
  #unlinked h4{margin:0 0 6px;}
  #unlinked.empty{display:none;}
  .card-bg{fill:var(--card);stroke:var(--edge);stroke-width:1.25px;}
  .card-shadow{fill:var(--ink);opacity:.09;pointer-events:none;}
  .card-hit{fill:transparent;pointer-events:all;}
  .card-name{font-size:14px;font-weight:600;font-family:var(--serif);
    fill:var(--name-ink);pointer-events:none;}
  .card-meta{font-size:11px;fill:var(--ink-muted);pointer-events:none;}
  .living-dot{fill:var(--living);pointer-events:none;}
  .card-row{cursor:pointer;}
  .card-row.unfilled{cursor:default;}
  .card-row.unfilled .card-name{fill:var(--ink-muted);font-style:italic;font-weight:400;}
  .card-row.deceased .card-rail{opacity:.7;}
  .card-row.deceased .card-name{fill:var(--ink-muted);}
  .card-row.uncertain .card-name{fill:var(--warn);}
  .card.hl .card-bg{stroke:var(--hl);stroke-width:2px;}
  .avatar{pointer-events:none;}
  #sheet{position:absolute;right:0;top:0;bottom:0;width:320px;background:var(--card);
    border-left:4px solid var(--rail-unknown);box-shadow:var(--shadow-card);
    padding:16px;overflow:auto;z-index:20;box-sizing:border-box;font-size:13px;color:var(--ink);}
  #sheet.hidden{display:none;}
  #sheet-close{position:absolute;right:8px;top:8px;width:44px;height:44px;
    border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--ink-muted);}
  .sheet-photo{display:block;width:96px;height:96px;border-radius:50%;
    object-fit:cover;margin:0 auto 10px;border:1px solid var(--edge);}
  #sheet h3{margin:0 0 2px;text-align:center;font-size:18px;font-weight:600;
    font-family:var(--serif);color:var(--name-ink);}
  .sheet-hi{margin:0 0 12px;text-align:center;color:var(--ink-muted);}
  #sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;}
  #sheet dt{color:var(--ink-muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
  #sheet dd{margin:0;font-size:13px;color:var(--ink);}
  .sheet-rel{margin-top:12px;padding-top:10px;border-top:1px solid var(--edge);line-height:1.9;}
  .sheet-rel span{color:var(--ink-muted);margin-right:4px;}
  .sheet-rel a{color:var(--rail-m);text-decoration:none;}
  #ornament-motto,#ornament-story{position:absolute;margin:0;pointer-events:none;
    font-family:var(--serif);font-style:italic;color:var(--name-ink);opacity:.75;z-index:4;}
  #ornament-motto{left:16px;bottom:16px;font-size:15px;line-height:1.45;
    background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:10px 14px;}
  #ornament-story{right:20px;bottom:20px;font-size:24px;line-height:1.3;text-align:right;}
  @media (max-width:768px){
    #ornament-motto{display:none;}
    #ornament-story{font-size:16px;right:12px;bottom:12px;}
  }
  #controls{position:absolute;top:12px;right:12px;z-index:6;display:flex;flex-direction:column;
    align-items:flex-end;gap:6px;cursor:default;}
  #controls-toggle{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);
    background:var(--card);box-shadow:var(--shadow-card);font-size:20px;cursor:pointer;color:var(--ink);}
  #controls-body{display:none;width:220px;background:var(--card);border:1px solid var(--edge);
    border-radius:10px;box-shadow:var(--shadow-card);padding:8px 12px;box-sizing:border-box;}
  #controls.open #controls-body{display:block;}
  #controls .ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;
    min-height:44px;font-size:14px;color:var(--ink);border-bottom:1px solid var(--rule);}
  #controls select{min-height:36px;max-width:130px;font-size:14px;font-family:var(--font);
    border:1px solid var(--edge);border-radius:6px;background:var(--card);color:var(--ink);}
  #controls .ctl-switch{cursor:pointer;}
  #living-only{width:20px;height:20px;accent-color:var(--hl);cursor:pointer;}
  #controls .zoom-buttons{display:flex;gap:4px;}
  #controls .zoom-buttons button{min-width:40px;min-height:36px;border:1px solid var(--edge);
    border-radius:6px;background:var(--card);font-size:15px;cursor:pointer;color:var(--ink);}
  #expand-all{display:block;width:100%;margin-top:8px;min-height:40px;border:1px solid var(--edge);
    border-radius:6px;background:var(--card);font-size:14px;cursor:pointer;color:var(--ink);}
  @media (max-width:768px){
    #sheet{right:0;left:0;top:auto;bottom:0;width:auto;max-height:60%;
      border-left:0;border-top:1px solid var(--edge);border-radius:12px 12px 0 0;
      box-shadow:var(--shadow-card);}
    #toolbar{padding:10px 12px 0;}
    #toolbar .title{font-size:22px;}
    #toolbar .summary{margin:8px -12px 0;padding:6px 12px;font-size:12px;}
    #top-actions #new-code{padding:6px 10px;}
  }
  .poster-ground{fill:var(--connector);opacity:.22;}
  .poster-root{fill:none;stroke:var(--bark-trunk);stroke-linecap:round;opacity:.85;}
  .poster-trunk{fill:var(--bark-trunk);}
  .poster-branch{fill:none;stroke:var(--bark);stroke-linecap:round;}
  .poster-branch.hl{stroke:var(--hl);}
  .poster-leaf{stroke:none;}
  .parent-card .pc-name{font-family:var(--serif);font-size:14.5px;font-weight:600;
    fill:var(--name-ink);pointer-events:none;}
  .parent-card.male .card-bg{fill:var(--card-m);stroke:var(--rail-m);}
  .parent-card.female .card-bg{fill:var(--card-f);stroke:var(--rail-f);}
  .pc-motif{pointer-events:none;}
  .pc-motif .petal{fill:var(--rail-f);opacity:.9;}
  .pc-motif .petal.outer{opacity:.55;}
  .pc-motif.female .motif-line{stroke:var(--leaf-1);}
  .pc-motif .leaf{fill:var(--leaf-1);}
  .pc-motif .vein{stroke:var(--card-m);stroke-width:.8px;}
  .garland{pointer-events:none;}
  .garland .leaf{fill:var(--leaf-1);}
  .garland-rope{fill:none;stroke:#D9731A;stroke-width:9px;stroke-linecap:round;}
  .curl{stroke:#B35A0E;stroke-width:.7px;}
  .rose{fill:#B3121B;stroke:#7A0A10;stroke-width:.7px;}
  .rose-core{fill:#D62A33;}
  .spouse-link{stroke:var(--bark);stroke-width:2px;}
  .spouse-card{cursor:pointer;}
  .gap-bg{fill:transparent;stroke:var(--ink-muted);stroke-width:1.6px;stroke-dasharray:7 5;cursor:pointer;}
  .place-hit .card-bg{stroke:#D9731A;stroke-width:2.5px;}
  .sg-place .sg-name::before{content:'\2302  ';color:#D9731A;}
  .sg-place.area .sg-name::before,.sg-place.city .sg-name::before{content:'\25C9  ';color:var(--rail-m);}
  .spouse-card.male .card-bg{fill:var(--card-m);stroke:var(--rail-m);}
  .spouse-card.female .card-bg{fill:var(--card-f);stroke:var(--rail-f);}
  .motif-line{fill:none;stroke:var(--bark);stroke-width:1.4px;stroke-linecap:round;}
  .pc-sub{font-size:11.5px;fill:var(--ink-muted);pointer-events:none;}
  .pc-rule{stroke:var(--rule);stroke-width:1px;}
  .pc-label{font-size:9.5px;fill:var(--ink-muted);letter-spacing:.05em;pointer-events:none;}
  .pc-value{font-size:12.5px;fill:var(--ink);pointer-events:none;}
  .pc-icon-bg{opacity:.28;pointer-events:none;}
  .pc-icon-fg{opacity:.95;pointer-events:none;}
  .pc-icon-cut{fill:var(--card);pointer-events:none;}
  #picks{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding-top:2px;}
  #picks:empty{display:none;}
  .pick{display:inline-flex;align-items:center;gap:4px;min-height:38px;
    padding:2px 4px 2px 14px;border:1px solid var(--edge);border-radius:999px;
    background:var(--canvas);font-family:var(--serif);font-size:15px;
    color:var(--name-ink);}
  .pick button{min-width:34px;min-height:34px;border:0;border-radius:50%;
    background:none;font-size:18px;line-height:1;color:var(--ink-muted);cursor:pointer;}
  .pick-place{border-color:#D9731A;}
  .pick button:hover{background:var(--card);color:var(--warn);}
  .pick-clear{min-height:38px;padding:0 14px;border:1px solid var(--edge);
    border-radius:999px;background:var(--card);font-family:var(--font);
    font-size:13px;color:var(--ink-muted);cursor:pointer;}
  .pick-note{font-size:14px;color:var(--ink-muted);}
  .pick-note b{font-family:var(--serif);font-size:15px;color:var(--hl);}
  #suggest{position:fixed;z-index:30;max-height:52vh;overflow-y:auto;
    background:var(--card);border:1px solid var(--edge);border-radius:10px;
    box-shadow:var(--shadow-card);padding:4px;box-sizing:border-box;}
  #suggest.hidden{display:none;}
  .sg-row{display:block;width:100%;min-height:44px;text-align:left;cursor:pointer;
    background:none;border:0;border-radius:7px;padding:6px 10px;font-family:var(--font);}
  .sg-row:hover,.sg-row.on{background:var(--canvas);}
  .sg-row:focus-visible{outline:2px solid var(--hl);}
  .sg-name{display:block;font-family:var(--serif);font-size:14px;font-weight:600;
    color:var(--name-ink);}
  .sg-hint{display:block;font-size:11px;color:var(--ink-muted);}
  .sg-more{margin:4px 10px 6px;font-size:11px;color:var(--ink-muted);}
  #login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:var(--canvas);padding:16px;box-sizing:border-box;}
  #login.hidden{display:none;}
  #login-form{width:100%;max-width:340px;background:var(--card);border-top:4px solid var(--hl);
    box-shadow:var(--shadow-card);padding:28px 24px;box-sizing:border-box;text-align:center;}
  #login h1{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--name-ink);}
  #login .login-hi{margin:2px 0 20px;color:var(--ink-muted);font-size:15px;}
  #login-input{width:100%;box-sizing:border-box;font-size:18px;min-height:48px;padding:8px 10px;
    border:1px solid var(--edge);font-family:var(--font);text-align:center;letter-spacing:.08em;}
  #login-enter{margin-top:12px;width:100%;min-height:48px;font-size:16px;cursor:pointer;
    background:var(--hl);color:#fff;border:0;font-family:var(--font);}
  #login-msg{min-height:1.4em;margin:14px 0 0;font-size:14px;color:var(--warn);}
  #sheet .code-hours{display:flex;gap:8px;justify-content:center;margin:12px 0;}
  #sheet .code-hours button{min-height:44px;padding:6px 14px;font-size:15px;cursor:pointer;}
  #sheet .code-value{font-family:ui-monospace,Menlo,monospace;font-size:30px;letter-spacing:.12em;
    text-align:center;margin:12px 0;color:var(--ink);user-select:all;}
  #code-copy{display:block;margin:0 auto;min-height:44px;padding:6px 18px;cursor:pointer;}
  #sheet .code-note{font-size:13px;color:var(--ink-muted);text-align:center;}
  #toolbar #new-code{min-height:44px;background:var(--hl);color:#fff;border:0;border-radius:8px;
    font-weight:600;font-size:14px;padding:6px 16px;font-family:var(--font);cursor:pointer;
    letter-spacing:.02em;box-shadow:var(--shadow-card);}
  #toolbar #new-code:hover{filter:brightness(1.08);}
  #sheet .code-name{display:block;margin:12px 0 0;font-size:13px;color:var(--ink-muted);}
  #code-name{display:block;width:100%;box-sizing:border-box;margin-top:4px;min-height:44px;
    padding:8px 10px;font-size:16px;border:1px solid var(--edge);border-radius:6px;font-family:var(--font);}
  #code-result[hidden]{display:none;}
  #sheet .code-link{margin:8px 0;font-size:12px;color:var(--ink-muted);word-break:break-all;
    text-align:center;user-select:all;}
</style>
</head>
<body>
<div id="login">
  <form id="login-form">
    <h1>Family Roots</h1>
    <p class="login-hi">परिवार वृक्ष</p>
    <input id="login-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="login-enter" type="submit">Enter</button>
    <p id="login-msg" role="alert"></p>
  </form>
</div>
<div id="toolbar">
  <div class="top-row">
    <div class="brand">
      <h1 class="title">Family Roots</h1>
      <p id="who" class="who"></p>
    </div>
    <span id="top-actions"></span>
    <div class="menu-wrap">
      <button id="avatar" type="button" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false"></button>
      <div id="menu" class="hidden" role="menu">
        <button id="lang" type="button" role="menuitem">Switch language</button>
      </div>
    </div>
  </div>
  <div class="search-row">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="search" placeholder="Search members" autocomplete="off" aria-label="Search names or villages">
    <p class="search-hint">Search names or villages</p>
  </div>
  <div id="picks"></div>
  <p class="summary" id="summary"></p>
</div>
<div id="stage"><svg><g id="viewport"></g></svg>
  <div id="controls">
    <button id="controls-toggle" type="button" aria-label="View options" aria-expanded="false">⚙</button>
    <div id="controls-body">
      <label class="ctl">View <select id="view-picker" aria-label="Tree view"></select></label>
      <label class="ctl">Show <select id="show-picker" aria-label="Who to show">
        <option value="all">Everyone</option>
        <option value="bloodline">Bloodline only</option>
      </select></label>
      <label class="ctl ctl-switch">Living only <input id="living-only" type="checkbox" role="switch"></label>
      <div class="ctl">Zoom
        <span class="zoom-buttons">
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <button id="zoom-fit" type="button">Fit</button>
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        </span>
      </div>
      <button id="expand-all" type="button">Expand all</button>
    </div>
  </div>
  <p id="ornament-motto">Generations grow,<br>roots stay forever</p>
  <p id="ornament-story">Our Roots<br>Our Family<br>Our Story</p>
</div>
<div id="unlinked"></div>
<div id="suggest" class="hidden"></div>
<div id="sheet" class="hidden">
  <button id="sheet-close" aria-label="Close">×</button>
  <div id="sheet-body"></div>

    var parent = p === owner ? FT.parentOf[owner.id] : null;
    if (parent) {
      var both = FT.parentsOf(owner);
      var parentRefs = [both.father, both.mother].filter(Boolean).map(function (x) {
        return x === parent ? personRef(x.id) : spouseRef(x, parent);
      });
      rel += '<div><span>Parents</span> ' + parentRefs.join(', ') + '</div>';
    }
    if (p !== owner) {
      rel += '<div><span>Spouse</span> ' + personRef(owner.id) + '</div>';
    } else if (owner.spouses && owner.spouses.length) {
      rel += '<div><span>Spouse</span> ' +
        owner.spouses.map(function (s) { return spouseRef(s, owner); }).join(', ') + '</div>';
    } else if (owner.placeholder) {
      rel += '<div><span>Spouse</span> <em>not recorded</em></div>';
    }
    var kids = owner.children || [];
    if (kids.length) {
      rel += '<div><span>Children</span> ' +
        kids.map(function (c) { return personRef(c.id); }).join(', ') + '</div>';
    }
    var siblings = parent ? parent.children.filter(function (c) { return c !== owner; }) : [];
    [['male', 'Brothers'], ['female', 'Sisters']].forEach(function (g) {
      var group = siblings.filter(function (c) { return c.gender === g[0]; });
      if (group.length) {
        rel += '<div><span>' + g[1] + '</span> ' +
          group.map(function (c) { return personRef(c.id); }).join(', ') + '</div>';
      }
    });
    if (rel) h += '<div class="sheet-rel">' + rel + '</div>';
    return h;
  }

  var sheet = document.getElementById('sheet');
  var sheetBody = document.getElementById('sheet-body');

  FT.closeSheet = function () {
    sheet.classList.add('hidden');
    FT.state.selected = null;
    FT.state.highlighted = null;
  };

  FT.select = function (id, owner) {
    var node = owner || FT.byId[id];
    if (!node) return;
    var person = node.id === id ? node :
      (node.spouses || []).filter(function (s) { return s.id === id; })[0] || node;
    FT.state.selected = id;
    FT.state.highlighted = node.id;
    highlight(node.id);
    sheetBody.innerHTML = sheetHtml(person, node);
    sheet.style.borderLeftColor = person.gender === 'female' ? 'var(--rail-f)' :
      person.gender === 'male' ? 'var(--rail-m)' : 'var(--rail-unknown)';
    sheet.classList.remove('hidden');
  };

  FT.lineage = function (id) {
    var keep = {};
    var n = FT.byId[id];
    while (n) { keep[n.id] = true; n = FT.parentOf[n.id]; }
    return keep;
  };

  FT.MAX_PICKS = 3;

  FT.commonAncestor = function (ids) {
    if (!ids.length) return null;
    var common = FT.lineage(ids[0]);
    ids.slice(1).forEach(function (id) {
      var line = FT.lineage(id);
      Object.keys(common).forEach(function (k) { if (!line[k]) delete common[k]; });
    });
    var best = null;
    Object.keys(common).forEach(function (k) {
      if (best === null || FT.depthOf(k) > FT.depthOf(best)) best = k;
    });
    return best;
  };

  FT.FOCUS_SCALE = 0.85;

  FT.focus = function (id) {
    if (FT.state.picks.indexOf(id) < 0) FT.state.picks = [id];
    FT.showPicks();
  };

  FT.clearPicks = function () {
    FT.state.picks = [];
    FT.state.place = null;
    FT.state.only = null;
    if (FT.renderPicks) FT.renderPicks();
  };

  FT.showPicks = function () {
    FT.state.place = null;
    var ids = FT.state.picks.filter(function (id) { return FT.byId[id]; });
    FT.state.picks = ids;
    FT.renderPicks();
    if (!ids.length) { FT.state.only = null; FT.render(); FT.fit(); return; }
    var keep = {}, deepest = 0;
    ids.forEach(function (id) {
      var line = FT.lineage(id);
      Object.keys(line).forEach(function (k) { keep[k] = true; });
      deepest = Math.max(deepest, FT.depthOf(id));
    });
    FT.state.only = keep;
    FT.state.collapsed = {};
    FT.revealDepth(deepest + 1);
    FT.render();
    if (ids.length > 1) { FT.fit(); FT.closeSheet(); return; }
    var n = FT.byId[ids[0]];
    var r = stage.getBoundingClientRect();
    scale = Math.max(scale, FT.FOCUS_SCALE);
    tx = r.width / 2 - (n.x + FT.jointX(n)) * scale;
    ty = r.height / 2 - n.y * scale;
    apply();
    FT.select(ids[0], n);
  };

  document.getElementById('sheet-close').addEventListener('click', FT.closeSheet);
  sheetBody.addEventListener('click', function (e) {
    var sp = e.target.closest('[data-spouse]');
    if (sp) {
      e.preventDefault();
      var owner = FT.byId[sp.getAttribute('data-owner')];
      if (owner) FT.select(sp.getAttribute('data-spouse'), owner);
      return;
    }
    var a = e.target.closest('[data-goto]');
    if (!a) return;
    e.preventDefault();
    FT.focus(a.getAttribute('data-goto'));
  });

  function fitText(t, avail) {
    var full = t.getComputedTextLength();
    if (full <= avail) return;
    var s = t.textContent;
    var keep = Math.max(1, Math.floor(s.length * avail / full) - 1);
    t.textContent = s.slice(0, keep) + '…';
    while (keep > 1 && t.getComputedTextLength() > avail) {
      keep -= 1;
      t.textContent = s.slice(0, keep) + '…';
    }
  }

  function drawRow(parent, p, rowIndex, owner) {
    var y = rowIndex * FT.ROW_H;
    var unfilled = !p.id;
    var cls = 'card-row' + (unfilled ? ' unfilled' : '') +
      (FT.isDeceased(p) ? ' deceased' : '') +
      (p.status === 'uncertain' ? ' uncertain' : '');
    var g = el('g', { 'class': cls, transform: 'translate(0,' + y + ')' }, parent);
    el('rect', {
      'class': 'card-hit', x: 0, y: 0, width: FT.CARD_W, height: FT.ROW_H
    }, g);
    el('rect', {
      'class': 'card-rail', x: 0, y: 0, width: FT.RAIL_W, height: FT.ROW_H,
      fill: unfilled ? 'var(--rail-unknown)'
        : (p.gender === 'female' ? 'var(--rail-f)' : 'var(--rail-m)')
    }, g);
    var textX = FT.RAIL_W + 12;
    if (p.photo) {
      var img = el('image', {
        href: p.photo, x: textX, y: (FT.ROW_H - FT.AVATAR) / 2,
        width: FT.AVATAR, height: FT.AVATAR,
        preserveAspectRatio: 'xMidYMid slice',
        'clip-path': 'inset(0 round 50%)', 'class': 'avatar'
      }, g);
      img.addEventListener('error', function () { g.removeChild(img); });
      textX += FT.AVATAR + 10;
    }
    var placeholder = unfilled ? FT.placeholderName(owner, p.gender) : null;
    var name = el('text', { 'class': 'card-name', x: textX, y: 21 }, g);
    name.textContent = placeholder ? placeholder[0] : FT.label(p)[0];
    fitText(name, FT.CARD_W - textX - 10);
    var meta = placeholder
      ? { text: placeholder[1] || '', dot: false }
      : FT.metaLine(p);
    if (meta.dot) {
      el('circle', { 'class': 'living-dot', cx: textX + 3, cy: 34, r: 3 }, g);
    }
    if (meta.text) {
      var metaX = textX + (meta.dot ? 12 : 0);
      var m = el('text', { 'class': 'card-meta', x: metaX, y: 38 }, g);
      m.textContent = meta.text;
      fitText(m, FT.CARD_W - metaX - 10);
    }
    if (!unfilled) {
      g.addEventListener('click', function (ev) {
        ev.stopPropagation();
        FT.select(p.id, owner);
      });
    }
    return g;
  }

  FT.parentsOf = function (n) {
    var p = FT.parentOf[n.id];
    if (!p) return { father: null, mother: null };
    var spouse = (p.spouses && p.spouses.length) ? p.spouses[0] : null;
    if (p.gender === 'female') return { mother: p, father: spouse };
    return { father: p, mother: spouse };
  };

  var SILHOUETTE = {
    male: [
      ['circle', { cx: 0, cy: -3, r: 3.7 }],
      ['ellipse', { 'class': 'pc-icon-cut', cx: 0, cy: -2.1, rx: 2.8, ry: 2.9 }],
      ['path', { d: 'M-6.8,8.4 C-6.8,3.8 -3.8,1.8 0,1.8 C3.8,1.8 6.8,3.8 6.8,8.4 Z' }],
      ['path', { 'class': 'pc-icon-cut', d: 'M-1.7,1.9 L0,4.6 L1.7,1.9 Z' }]
    ],
    female: [
      ['circle', { cx: 0, cy: -7.8, r: 1.9 }],
      ['path', { d: 'M-3.9,-3 C-3.9,-7.8 3.9,-7.8 3.9,-3 L4.5,2.6 L-4.5,2.6 Z' }],
      ['ellipse', { 'class': 'pc-icon-cut', cx: 0, cy: -2.2, rx: 2.5, ry: 2.9 }],
      ['path', { d: 'M-6.2,8.4 C-6.2,4.8 -3.4,2.8 0,2.8 C3.4,2.8 6.2,4.8 6.2,8.4 Z' }]
    ]
  };

  function personIcon(g, cx, cy, gender, scale) {
    var tint = gender === 'female' ? 'var(--rail-f)' : 'var(--rail-m)';
    var icon = el('g', {
      transform: 'translate(' + cx + ',' + cy + ') scale(' + (scale || 1) + ')'
    }, g);
    var bg = el('circle', { 'class': 'pc-icon-bg', r: 9 }, icon);
    bg.style.fill = tint;
    SILHOUETTE[gender === 'female' ? 'female' : 'male'].forEach(function (part) {
      var attrs = { 'class': part[1]['class'] || 'pc-icon-fg' };
      Object.keys(part[1]).forEach(function (k) { if (k !== 'class') attrs[k] = part[1][k]; });
      var shape = el(part[0], attrs, icon);
      if (attrs['class'] === 'pc-icon-fg') shape.style.fill = tint;
    });
  }

  var PETAL = 'M0,6 C-4.2,1 -3.8,-6 0,-10 C3.8,-6 4.2,1 0,6 Z';
  var LEAF = 'M0,8 C-6.5,3 -6,-5 0,-10 C6,-5 6.5,3 0,8 Z';

  function genderMotif(g, cx, cy, gender) {
    var m = el('g', {
      'class': 'pc-motif ' + gender, transform: 'translate(' + cx + ',' + cy + ')'
    }, g);
    if (gender === 'female') {
      [-64, -32, 0, 32, 64].forEach(function (a) {
        el('path', { 'class': Math.abs(a) > 40 ? 'petal outer' : 'petal', d: PETAL,
          transform: 'rotate(' + a + ' 0 6)' }, m);
      });
      el('path', { 'class': 'motif-line', d: 'M-10,8 Q0,12 10,8' }, m);
      return;
    }
    el('path', { 'class': 'motif-line', d: 'M-2,11 Q0,2 0,-4' }, m);
    [[-38, -4, 2], [34, 5, -1]].forEach(function (l) {
      var t = 'translate(' + l[1] + ',' + l[2] + ') rotate(' + l[0] + ') scale(0.85)';
      el('path', { 'class': 'leaf', d: LEAF, transform: t }, m);
      el('path', { 'class': 'vein', d: 'M0,7 L0,-8', transform: t }, m);
    });
  }

  var ROPE = ['#F29A2E', '#E3801C', '#F7B04A'];

  function rose(m, x, y, r) {
    [[-r * 0.7, 0], [r * 0.7, 0], [0, -r * 0.6]].forEach(function (d) {
      el('circle', { 'class': 'rose', cx: x + d[0], cy: y + d[1], r: r }, m);
    });
    el('circle', { 'class': 'rose-core', cx: x, cy: y - r * 0.2, r: r * 0.45 }, m);
  }

  function garland(g, top, H, knob) {
    var W = FT.CARD_W, y0 = top + 4, side = top + H - 14, dip = top + H + 20;
    var m = el('g', { 'class': 'garland' }, g);
    var rope = el('path', { 'class': 'garland-rope',
      d: 'M0,' + y0 + ' L-1,' + side + ' C-1,' + dip + ' ' + (W + 1) + ',' + dip + ' ' +
         (W + 1) + ',' + side + ' L' + W + ',' + y0 }, m);
    var len = rope.getTotalLength();
    function at(f) { var p = rope.getPointAtLength(f * len); return [p.x, p.y]; }
    var CURLS = 90;
    for (var i = 0; i <= CURLS; i++) {
      var p = at(i / CURLS), q = at(Math.min(1, i / CURLS + 0.005));
      var tilt = Math.atan2(q[1] - p[1], q[0] - p[0]) * 180 / Math.PI + (i % 2 ? 35 : -35);
      var curl = el('ellipse', { 'class': 'curl', cx: 0, cy: 0, rx: 4.2, ry: 3,
        transform: 'translate(' + p[0] + ',' + p[1] + ') rotate(' + tilt + ') translate(0,' + (i % 2 ? -2 : 2) + ')' }, m);
      curl.style.fill = ROPE[i % 3];
    }
    [0.22, 0.78].forEach(function (f) { var p = at(f); rose(m, p[0], p[1], 3.8); });
    var low = at(0.5)[1];
    [6, 11].forEach(function (d, i) {
      var k = el('ellipse', { 'class': 'curl', cx: W / 2, cy: low + d, rx: 4.6, ry: 3.4 }, m);
      k.style.fill = ROPE[i];
    });
    el('path', { 'class': 'leaf', d: LEAF, transform: 'translate(' + (W / 2 - 5) + ',' + (low + 17) + ') rotate(-60) scale(0.45)' }, m);
    el('path', { 'class': 'leaf', d: LEAF, transform: 'translate(' + (W / 2 + 5) + ',' + (low + 17) + ') rotate(60) scale(0.45)' }, m);
    rose(m, W / 2, low + 18, 3.4);
    if (knob && Math.abs(knob.x - W / 2) < 30 && knob.y > top + H - 10) knob.y = top + H + 50;
  }

  FT.knob = function (g, n, cx, cy) {
    var hit = el('circle', { 'class': 'toggle-hit', cx: cx, cy: cy, r: 22 }, g);
    el('circle', { 'class': 'toggle', cx: cx, cy: cy, r: 10 }, g);
    var sign = el('text', {
      'class': 'toggle-sign', x: cx, y: cy + 5, 'text-anchor': 'middle'
    }, g);
    sign.textContent = FT.kidsAt(n, n.depth || 0).length ? '\u2212' : '+';
    hit.addEventListener('click', function (ev) {
      ev.stopPropagation();
      FT.toggleKids(n, n.depth || 0);
    });
  };

  FT.cardH = function (p, rows) {
    return 44 + rows * 30 + (FT.metaLine(p).text ? 16 : 0);
  };

  function spouseWord(s) {
    return s.gender === 'female' ? 'Wife' : s.gender === 'male' ? 'Husband' : 'Spouse';
  }

  function cardFace(g, p, H, rows, valueRoom) {
    el('rect', { 'class': 'card-shadow', x: 0, y: 3, width: FT.CARD_W, height: H, rx: 10 }, g);
    el('rect', { 'class': 'card-bg', width: FT.CARD_W, height: H, rx: 10 }, g);
    el('rect', { 'class': 'card-hit', width: FT.CARD_W, height: H }, g);
    var title = el('text', {
      'class': 'pc-name', x: FT.CARD_W / 2, y: 26, 'text-anchor': 'middle'
    }, g);
    title.textContent = FT.label(p)[0];
    fitText(title, FT.CARD_W - 84);
    if (p.gender) {
      personIcon(g, 22, 21, p.gender, 1.3);
      genderMotif(g, FT.CARD_W - 22, 21, p.gender);
    }
    var meta = FT.metaLine(p);
    var drop = 0;
    if (meta.text) {
      var sub = el('text', {
        'class': 'pc-sub', x: FT.CARD_W / 2, y: 42, 'text-anchor': 'middle'
      }, g);
      sub.textContent = meta.text;
      fitText(sub, FT.CARD_W - 24);
      drop = 16;
    }
    el('line', {
      'class': 'pc-rule', x1: 18, y1: 38 + drop, x2: FT.CARD_W - 18, y2: 38 + drop
    }, g);
    rows.forEach(function (row, i) {
      var y = 58 + drop + i * 30;
      personIcon(g, 32, y, row[2]);
      var lab = el('text', { 'class': 'pc-label', x: 52, y: y - 3 }, g);
      lab.textContent = row[0];
      var val = el('text', { 'class': 'pc-value', x: 52, y: y + 11 }, g);
      val.textContent = row[1] ? FT.label(row[1])[0] : '(Unknown)';
      fitText(val, valueRoom(i));
    });
  }

  function gapCard(g, n, H) {
    el('rect', { 'class': 'gap-bg', width: FT.CARD_W, height: H, rx: 10 }, g);
    var t = el('text', { 'class': 'pc-name', x: FT.CARD_W / 2, y: H / 2 - 4, 'text-anchor': 'middle' }, g);
    t.textContent = FT.label(n)[0];
    var sub = el('text', { 'class': 'pc-sub', x: FT.CARD_W / 2, y: H / 2 + 16, 'text-anchor': 'middle' }, g);
    sub.textContent = 'names not yet recorded';
    g.addEventListener('click', function () { FT.select(n.id, n); });
  }

  FT.drawParentCard = function (parent, n) {
    var g = el('g', {
      'class': 'card parent-card' + (n.gender ? ' ' + n.gender : ''), 'data-id': n.id,
      transform: 'translate(' + n.x + ',' + n.y + ')'
    }, parent);
    var H = FT.cardH(n, 2);
    if (n.status === 'gap') {
      gapCard(g, n, H);
      var gv = FT.views[FT.state.viewId];
      var gat = gv && gv.togglePos ? gv.togglePos(n) : { x: FT.jointX(n), y: -12 };
      if ((n.children || []).length && !FT.state.place) FT.knob(g, n, gat.x, gat.y);
      return g;
    }
    var main = el('g', {}, g);
    var pr = FT.parentsOf(n);
    cardFace(main, n, H, [['Father', pr.father, 'male'], ['Mother', pr.mother, 'female']],
      function () { return FT.CARD_W - 66; });
    main.addEventListener('click', function () { FT.select(n.id, n); });

    var sp = FT.spouseOf(n);
    var spX = FT.CARD_W + FT.COUPLE_GAP;
    if (sp) {
      el('line', { 'class': 'spouse-link', x1: FT.CARD_W, y1: H / 2, x2: spX, y2: H / 2 }, g);
      var sg = el('g', { 'class': 'spouse-card ' + (sp.gender || ''),
        transform: 'translate(' + spX + ',0)' }, g);
      cardFace(sg, sp, H, [['Father', sp.father ? { name: sp.father } : null, 'male'],
        [spouseWord(sp) + ' of', n, n.gender]],
        function () { return FT.CARD_W - 66; });
      sg.addEventListener('click', function (ev) { ev.stopPropagation(); FT.select(sp.id, n); });
    }

    var hasKids = (n.children || []).length > 0 && !FT.state.place;
    var view = FT.views[FT.state.viewId];
    var at = view && view.togglePos ? view.togglePos(n) : { x: FT.jointX(n), y: -12 };
    if (FT.isDeceased(n)) garland(g, 0, H, at);
    if (sp && FT.isDeceased(sp)) {
      var sgl = el('g', { transform: 'translate(' + spX + ',0)' }, g);
      garland(sgl, 0, H, null);
    }
    if (hasKids) FT.knob(g, n, at.x, at.y);
    return g;
  };

  FT.ROOT_ART_LEN = 350;
  FT.ROOT_SCALE = 0.5;

  FT.rootArt = function (parent, transform, groundSpin) {
    var g = el('g', { 'class': 'root-art', transform: transform }, parent);
    var ground = { 'class': 'poster-ground', cx: 0, cy: 24, rx: 430, ry: 52 };
    if (groundSpin) ground.transform = groundSpin;
    el('ellipse', ground, g);
    [-1, 1].forEach(function (dir) {
      for (var i = 1; i <= 4; i++) {
        var h = FT.hash01('root' + dir + i);
        var reach = dir * (70 + i * 62 + h * 40);
        var drop = 120 + i * 34 + h * 40;
        var r = el('path', {
          'class': 'poster-root',
          d: 'M0,-10 C' + (reach * 0.35) + ',14 ' +
             (reach * 0.95) + ',' + (drop * 0.35) + ' ' + reach + ',' + drop
        }, g);
        r.style.strokeWidth = Math.max(2.5, 12 - i * 2.1) + 'px';
      }
    });
    var bw = 44, tw = 13, top = -FT.ROOT_ART_LEN;
    el('path', {
      'class': 'poster-trunk',
      d: 'M' + (-bw) + ',30 C' + (-bw * 0.55) + ',-90 ' +
         (-tw * 2.6) + ',' + (top + 170) + ' ' + (-tw) + ',' + top +
         ' L' + tw + ',' + top +
         ' C' + (tw * 2.6) + ',' + (top + 170) + ' ' +
         (bw * 0.55) + ',-90 ' + bw + ',30 Z'
    }, g);
    return g;
  };

  FT.drawNode = function (parent, n) {
    var view = FT.views[FT.state.viewId];
    if (view && view.cardStyle === 'parents') return FT.drawParentCard(parent, n);
    var g = el('g', {
      'class': 'card', 'data-id': n.id,
      transform: 'translate(' + n.x + ',' + n.y + ')'
    }, parent);
    el('rect', {
      'class': 'card-shadow', y: 3, width: FT.CARD_W, height: FT.nodeH(n), rx: 8
    }, g);
    el('rect', {
      'class': 'card-bg', width: FT.CARD_W, height: FT.nodeH(n), rx: 8
    }, g);
    drawRow(g, n, 0, n);
    FT.partners(n).forEach(function (p, i) { drawRow(g, p, i + 1, n); });
    if ((n.children || []).length) {
      var tview = FT.views[FT.state.viewId];
      var at = tview && tview.togglePos ? tview.togglePos(n)
        : { x: FT.jointX(n), y: FT.jointY(n) + 8 };
      FT.knob(g, n, at.x, at.y);
    }
    g.addEventListener('click', function () { FT.select(n.id, n); });
    return g;
  };

  FT.maxDepth = function () {
    if (FT.state.depthCap !== null) return FT.state.depthCap;
    return FT.viewCap();
  };

  FT.render = function () {
    while (vp.firstChild) vp.removeChild(vp.firstChild);
    var view = FT.views[FT.state.viewId] || FT.views.classic;
    var owners = placeLayout();
    if (owners) {
      var grid = el('g', {}, vp);
      owners.forEach(function (n) { FT.drawNode(grid, n); });
      markPlace();
      apply();
      return;
    }
    view.layout(tree);
    var edges = el('g', {}, vp);
    var nodes = el('g', {}, vp);
    stage.setAttribute('data-view', view.id);
    view.drawEdges(edges, tree);
    (function walk(n, depth) {
      FT.drawNode(nodes, n);
      FT.kidsAt(n, depth).forEach(function (c) { walk(c, depth + 1); });
    })(tree, 0);
    if (FT.state.picks.length) {
      clearHl();
      FT.state.picks.forEach(hlPath);
    } else if (FT.state.highlighted) highlight(FT.state.highlighted);
    markPlace();
    apply();
  };

  function clearHl(){
    var hl=vp.querySelectorAll('.hl');
    for(var i=0;i<hl.length;i++) hl[i].classList.remove('hl');
  }
  function highlight(id){
    clearHl();
    hlPath(id);
  }
  function hlPath(id){
    var cur=id;
    while(cur){
      var node=vp.querySelector('[data-id="'+CSS.escape(cur)+'"]');
      if(node) node.classList.add('hl');
      var edge=vp.querySelector('.edge[data-edge="'+CSS.escape(cur)+'"]');
      if(edge) edge.classList.add('hl');
      cur=FT.parentOf[cur]?FT.parentOf[cur].id:null;
    }
  }

  var tx=40, ty=20, scale=1, dragging=false, lx=0, ly=0;
  function apply(){
    vp.setAttribute('transform','translate('+tx+','+ty+') scale('+scale+')');
  }
  stage.addEventListener('mousedown',function(e){ dragging=true; lx=e.clientX; ly=e.clientY; stage.classList.add('grabbing'); });
  window.addEventListener('mousemove',function(e){ if(!dragging) return; tx+=e.clientX-lx; ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; apply(); });
  window.addEventListener('mouseup',function(){ dragging=false; stage.classList.remove('grabbing'); });
  stage.addEventListener('wheel',function(e){
    e.preventDefault();
    var f=e.deltaY<0?1.1:1/1.1;
    var r=stage.getBoundingClientRect();
    var mx=e.clientX-r.left, my=e.clientY-r.top;
    tx=mx-(mx-tx)*f; ty=my-(my-ty)*f; scale*=f; apply();
  }, {passive:false});

  // touch: one finger pans, two fingers pinch-zoom
  function tdist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
  var touch=null;
  stage.addEventListener('touchstart',function(e){
    if(e.touches.length===1){ touch={mode:'pan', x:e.touches[0].clientX, y:e.touches[0].clientY}; }
    else if(e.touches.length===2){ touch={mode:'pinch', d:tdist(e.touches),
      cx:(e.touches[0].clientX+e.touches[1].clientX)/2, cy:(e.touches[0].clientY+e.touches[1].clientY)/2}; }
  }, {passive:false});
  stage.addEventListener('touchmove',function(e){
    if(!touch) return;
    e.preventDefault();
    if(touch.mode==='pan' && e.touches.length===1){
      tx+=e.touches[0].clientX-touch.x; ty+=e.touches[0].clientY-touch.y;
      touch.x=e.touches[0].clientX; touch.y=e.touches[0].clientY; apply();
    } else if(touch.mode==='pinch' && e.touches.length===2){
      var nd=tdist(e.touches); if(!touch.d){ touch.d=nd; return; }
      var f=nd/touch.d, r=stage.getBoundingClientRect();
      var mx=touch.cx-r.left, my=touch.cy-r.top;
      tx=mx-(mx-tx)*f; ty=my-(my-ty)*f; scale*=f; touch.d=nd; apply();
    }
  }, {passive:false});
  stage.addEventListener('touchend',function(e){ if(e.touches.length===0) touch=null; });

  var VIEW_ORDER = ['classic', 'horizontal', 'poster'];

  FT.placeholderName = function (owner, gender) {
    var en = (owner.name || owner.name_hi || owner.id) +
      (gender === 'male' ? "'s husband" : "'s wife");
    var hi = owner.name_hi ?
      owner.name_hi + (gender === 'male' ? ' के पति' : ' की पत्नी') : '';
    return FT.state.lang === 'hi' ? [hi || en] : [en];
  };

  FT.collapseBelowOpenDepth = function () {
    (function walk(n, depth) {
      if (depth >= FT.OPEN_DEPTH && (n.children || []).length) {
        FT.state.collapsed[n.id] = true;
      }
      (n.children || []).forEach(function (c) { walk(c, depth + 1); });
    })(tree, 0);
  };

  FT.expandAll = function () {
    FT.clearPicks();
    FT.state.collapsed = {};
    FT.state.depthCap = Infinity;
    FT.render();
    FT.fit();
  };

  FT.setView = function (id) {
    if (!FT.views[id]) return;
    FT.state.viewId = id;
    FT.clearPicks();
    FT.state.depthCap = null;
    try { localStorage.setItem('ft-view', id); } catch (e) {}
    document.getElementById('view-picker').value = id;
    FT.render();
    FT.fit();
  };

  FT.fit = function () {
    var view = FT.views[FT.state.viewId];
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    var owners = placeLayout();
    if (owners) {
      owners.forEach(function (n) {
        minX = Math.min(minX, n.x - 20); maxX = Math.max(maxX, n.x + FT.nodeW(n) + 20);
        minY = Math.min(minY, n.y - 20); maxY = Math.max(maxY, n.y + FT.nodeH(n) + 50);
      });
      view = {};
    } else (function walk(n, depth) {
      var w = FT.nodeW(n);
      var h = FT.nodeH(n);
      minX = Math.min(minX, n.x - w / 2); maxX = Math.max(maxX, n.x + w);
      minY = Math.min(minY, n.y - h / 2); maxY = Math.max(maxY, n.y + h);
      FT.kidsAt(n, depth).forEach(function (c) { walk(c, depth + 1); });
    })(tree, 0);
    if (view.extentPad) {
      minX = Math.min(minX, view.extentPad.minX); maxX = Math.max(maxX, view.extentPad.maxX);
      minY = Math.min(minY, view.extentPad.minY); maxY = Math.max(maxY, view.extentPad.maxY);
    }
    var r = stage.getBoundingClientRect();
    var stageW = r.width > 0 ? r.width : window.innerWidth;
    var stageH = r.height > 0 ? r.height : window.innerHeight;
    var pad = window.innerWidth < 768 ? 14 : 40;
    scale = Math.min(
      (stageW - pad * 2) / Math.max(1, maxX - minX),
      (stageH - pad * 2) / Math.max(1, maxY - minY)
    );
    scale = Math.min(scale, 1.2);
    tx = pad - minX * scale + (stageW - pad * 2 - (maxX - minX) * scale) / 2;
    ty = pad - minY * scale + (stageH - pad * 2 - (maxY - minY) * scale) / 2;
    apply();
  };

  function populateViewPicker() {
    var sel = document.getElementById('view-picker');
    VIEW_ORDER.forEach(function (id) {
      if (!FT.views[id]) return;
      var o = document.createElement('option');

      o.textContent = FT.views[id].label;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () { FT.setView(sel.value); });
  }


  var RANK_PREFIX = 0, RANK_SUBSTRING = 1, RANK_SUBSEQUENCE = 2;

  function subsequence(hay, needle) {
    var i = 0;
    for (var j = 0; j < hay.length && i < needle.length; j++) {
      if (hay[j] === needle[i]) i++;
    }
    return i === needle.length;
  }

  var PLACE_HINT = { origin: 'Origin village', area: 'Present area', city: 'Present city · all areas' };

  FT.placeGroups = function () {
    var groups = {};
    function add(kind, name, suffix, person, owner) {
      if (!norm(name)) return;
      var key = kind + ':' + norm(name);
      var grp = groups[key] || (groups[key] = { key: key, kind: kind, name: name, suffix: '', members: [] });
      if (!grp.suffix && suffix) grp.suffix = suffix;
      grp.members.push({ person: person, owner: owner });
    }
    function addPerson(p, owner) {
      var o = p.origin || {}, a = p.address || {};
      add('origin', o.village, o.state, p, owner);
      add('area', a.locality, a.city || a.state, p, owner);
      add('city', a.city, a.state, p, owner);
    }
    FT.nodes.forEach(function (n) {
      addPerson(n, n);
      (n.spouses || []).forEach(function (s) { addPerson(s, n); });
    });
    return groups;
  };

  FT.placeMatches = function (q) {
    var needle = norm(q);
    if (!needle) return [];
    var groups = FT.placeGroups();
    return Object.keys(groups).map(function (k) { return groups[k]; })
      .filter(function (g) { return norm(g.name).indexOf(needle) >= 0; })
      .sort(function (a, b) {
        return (norm(b.name).indexOf(needle) === 0) - (norm(a.name).indexOf(needle) === 0) ||
          a.name.localeCompare(b.name) || a.kind.localeCompare(b.kind);
      });
  };

  FT.placeLabel = function (g) {
    return g.name + (g.suffix && norm(g.suffix) !== norm(g.name) ? ', ' + g.suffix : '');
  };

  FT.showPlace = function (key) {
    var grp = FT.placeGroups()[key];
    FT.state.picks = [];
    FT.state.place = grp ? key : null;
    FT.renderPicks();
    FT.state.only = null;
    FT.closeSheet();
    FT.render();
    FT.fit();
  };

  function placeLayout() {
    var grp = FT.state.place && FT.placeGroups()[FT.state.place];
    if (!grp) return null;
    var seen = {}, owners = [];
    grp.members.forEach(function (m) {
      if (!seen[m.owner.id]) { seen[m.owner.id] = true; owners.push(m.owner); }
    });
    owners.sort(function (a, b) {
      return FT.depthOf(a.id) - FT.depthOf(b.id) ||
        FT.label(a)[0].localeCompare(FT.label(b)[0]);
    });
    var rowH = 0, area = 0;
    owners.forEach(function (n) { rowH = Math.max(rowH, FT.nodeH(n) + 70); });
    owners.forEach(function (n) { area += (FT.nodeW(n) + FT.H_GAP) * rowH; });
    var r = stage.getBoundingClientRect();
    var aspect = r.width > 0 && r.height > 0 ? r.width / r.height : 1.5;
    var rowMax = Math.max(2 * FT.CARD_W + FT.COUPLE_GAP, Math.sqrt(area * aspect));
    var x = 0, y = 0;
    owners.forEach(function (n) {
      if (x > 0 && x + FT.nodeW(n) > rowMax) { x = 0; y += rowH; }
      n.x = x;
      n.y = y;
      x += FT.nodeW(n) + FT.H_GAP;
    });
    return owners;
  }

  function markPlace() {
    var grp = FT.state.place && FT.placeGroups()[FT.state.place];
    if (!grp) return;
    grp.members.forEach(function (m) {
      var card = vp.querySelector('[data-id="' + CSS.escape(m.owner.id) + '"]');
      if (!card) return;
      var face = m.person === m.owner ? card.firstChild : card.querySelector('.spouse-card');
      if (face) face.classList.add('place-hit');
    });
  }

  FT.searchMatches = function (q, limit) {
    var needle = q.trim().toLowerCase();
    if (!needle) return { list: [], total: 0 };
    var hits = [];
    FT.nodes.forEach(function (n) {
      var fields = [n.name || '', n.name_hi || ''];
      var best = null;
      fields.forEach(function (f) {
        var hay = f.toLowerCase();
        if (!hay) return;
        var rank = null;
        if (hay.indexOf(needle) === 0) rank = RANK_PREFIX;
        else if (hay.indexOf(needle) > 0) rank = RANK_SUBSTRING;
        else if (subsequence(hay, needle)) rank = RANK_SUBSEQUENCE;
        if (rank !== null && (best === null || rank < best)) best = rank;
      });
      if (best !== null) hits.push({ node: n, rank: best });
    });
    hits.sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank;
      return FT.label(a.node)[0].localeCompare(FT.label(b.node)[0]);
    });
    return { list: hits.slice(0, limit || 12), total: hits.length };
  };

  var searchBox = document.getElementById('search');

  var picked = -1;

  function hideSuggest() {
    suggest.classList.add('hidden');
    suggest.innerHTML = '';

  }

  function placeSuggest() {
    var r = searchBox.getBoundingClientRect();
    suggest.style.left = r.left + 'px';
    suggest.style.top = (r.bottom + 4) + 'px';
    suggest.style.width = Math.max(220, r.width) + 'px';
  }

  function renderSuggest() {
    var res = FT.searchMatches(searchBox.value);
    var places = FT.placeMatches(searchBox.value);
    if (!res.list.length && !places.length) { hideSuggest(); return; }
    var html = places.map(function (g) {
      var n = g.members.length;
      return '<button class="sg-row sg-place ' + g.kind + '" data-place="' + esc(g.key) + '">' +
        '<span class="sg-name">' + esc(FT.placeLabel(g)) + '</span>' +
        '<span class="sg-hint">' + PLACE_HINT[g.kind] + ' · ' + n + (n === 1 ? ' person' : ' people') +
        '</span></button>';
    }).join('') + res.list.map(function (m, i) {
      var parent = FT.parentOf[m.node.id];
      var hint = parent ? 'child of ' + esc(FT.label(parent)[0]) : 'root ancestor';
      return '<button class="sg-row" data-goto="' + esc(m.node.id) + '" data-i="' + i + '">' +
        '<span class="sg-name">' + esc(FT.label(m.node)[0]) + '</span>' +
        '<span class="sg-hint">' + hint + '</span></button>';
    }).join('');
    if (res.total > res.list.length) {
      html += '<p class="sg-more">' + (res.total - res.list.length) + ' more…</p>';
    }
    suggest.innerHTML = html;
    placeSuggest();
    suggest.classList.remove('hidden');

  function mark() {
    var rows = suggest.querySelectorAll('.sg-row');
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle('on', i === picked);

  var picksBar = document.getElementById('picks');
  var pickNote = '';

  FT.renderPicks = function () {
    var ids = FT.state.picks;
    var grp = FT.state.place && FT.placeGroups()[FT.state.place];
    if (grp) {
      picksBar.innerHTML = '<span class="pick pick-place">' + esc(FT.placeLabel(grp)) +
        ' · ' + grp.members.length + (grp.members.length === 1 ? ' person' : ' people') +
        '<button class="pick-clear-x" aria-label="Remove">×</button></span>';
      return;
    }
    var html = ids.map(function (id) {
      return '<span class="pick">' + esc(FT.label(FT.byId[id])[0]) +
        '<button data-drop="' + esc(id) + '" aria-label="Remove">×</button></span>';
    }).join('');
    if (ids.length > 1) {
      var a = FT.commonAncestor(ids);
      html += '<span class="pick-note">Common father: <b>' +
        (a ? esc(FT.label(FT.byId[a])[0]) : '—') + '</b></span>';
    }
    if (pickNote) html += '<span class="pick-note">' + esc(pickNote) + '</span>';
    if (ids.length) html += '<button class="pick-clear">Clear</button>';
    picksBar.innerHTML = html;
  };

  picksBar.addEventListener('click', function (e) {
    var drop = e.target.closest('[data-drop]');
    if (drop) {
      var id = drop.getAttribute('data-drop');
      FT.state.picks = FT.state.picks.filter(function (p) { return p !== id; });
      pickNote = '';
      FT.showPicks();
      return;
    }
    if (e.target.closest('.pick-clear-x')) {
      FT.showPlace(null);
      return;
    }
    if (e.target.closest('.pick-clear')) {
      pickNote = '';
      FT.state.picks = [];
      FT.showPicks();
    }
  });

  function choose(row) {
    var v = row.getAttribute('data-place');
    if (!v) { go(row.getAttribute('data-goto')); return; }
    hideSuggest();
    searchBox.value = '';
    searchBox.blur();
    pickNote = '';
    FT.showPlace(v);
  }

  function go(id) {
    hideSuggest();
    searchBox.value = '';
    searchBox.blur();
    if (FT.state.picks.indexOf(id) < 0) {
      if (FT.state.picks.length >= FT.MAX_PICKS) {
        pickNote = 'Up to ' + FT.MAX_PICKS + ' people — remove one first.';
        FT.renderPicks();
        return;
      }
      FT.state.picks = FT.state.picks.concat([id]);
    }
    pickNote = '';
    FT.showPicks();
  }

  searchBox.addEventListener('input', renderSuggest);
  searchBox.addEventListener('focus', function () {
    if (searchBox.value.trim()) renderSuggest();
  });

  searchBox.addEventListener('keydown', function (e) {
    var rows = suggest.querySelectorAll('.sg-row');
    if (e.key === 'ArrowDown' && rows.length) {
      e.preventDefault(); picked = (picked + 1) % rows.length; mark(); return;
    }
    if (e.key === 'ArrowUp' && rows.length) {
      e.preventDefault(); picked = (picked <= 0 ? rows.length : picked) - 1; mark(); return;
    }
    if (e.key === 'Escape') { hideSuggest(); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (picked >= 0 && rows[picked]) { choose(rows[picked]); return; }
      if (rows.length) choose(rows[0]);
    }
  });

  suggest.addEventListener('click', function (e) {
    var row = e.target.closest('.sg-row');
    if (row) choose(row);

  document.addEventListener('click', function (e) {

FT.views.classic = {
  id: 'classic',
  label: 'Classic (top-down)',
  nodeShape: 'box',
  cardStyle: 'parents',
  togglePos: function (n) { return { x: FT.jointX(n), y: FT.jointY(n) + 8 }; },
  layout: function (root) {
    var rowHeight = [];
    (function measure(n, depth) {
      rowHeight[depth] = Math.max(rowHeight[depth] || 0, FT.nodeH(n));
      FT.visibleChildren(n).forEach(function (c) { measure(c, depth + 1); });
    })(root, 0);
    var rowTop = [0];
    for (var d = 0; d < rowHeight.length; d++) {
      rowTop[d + 1] = rowTop[d] + rowHeight[d] + FT.V_GAP;
    }
    var cursor = 0;
    function shiftRight(n, dx) {
      n.x += dx;
      FT.visibleChildren(n).forEach(function (c) { shiftRight(c, dx); });
    }
    (function place(n, depth) {
      n.depth = depth;
      n.y = rowTop[depth];
      var kids = FT.visibleChildren(n);
      var start = cursor;
      if (!kids.length) {
        n.x = cursor + FT.H_GAP / 2;
        cursor += FT.nodeW(n) + FT.H_GAP;
        return;
      }
      kids.forEach(function (c) { place(c, depth + 1); });
      var first = kids[0], last = kids[kids.length - 1];
      var mid = (first.x + FT.jointX(first) + last.x + FT.jointX(last)) / 2;
      n.x = mid - FT.jointX(n);
      var room = start + FT.H_GAP / 2 - n.x;
      if (room > 0) {
        kids.forEach(function (c) { shiftRight(c, room); });
        n.x += room;
      }
      cursor = Math.max(cursor, n.x + FT.nodeW(n) + FT.H_GAP / 2);
    })(root, 0);
    var cx = root.x + FT.jointX(root);
    this.extentPad = {
      minX: cx - 280, maxX: cx + 280,
      minY: root.y - FT.ROOT_SCALE * (FT.ROOT_ART_LEN + 320), maxY: root.y
    };
  },
  drawEdges: function (g, root) {
    var s = FT.ROOT_SCALE;
    FT.rootArt(g, 'translate(' + (root.x + FT.jointX(root)) + ',' +
      (root.y - s * FT.ROOT_ART_LEN) + ') scale(' + s + ',' + (-s) + ')');

      var bow = (x2 - x1) * 0.42 + (FT.hash01(id) - 0.5) * 70;

  }

  var ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  var EPOCH = Date.UTC(2026, 0, 1);
  var STEP_MS = 10 * 60 * 1000;
  var HOUR_MS = 60 * 60 * 1000;
  var FIRST_USE_MS = 24 * HOUR_MS;
  var SIG_SPACE = 1048576;

  function hexBytes(hex) {
    var out = new Uint8Array(hex.length / 2);
    for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
    return out;
  }

  function bytesHex(buffer) {
    return Array.prototype.map.call(new Uint8Array(buffer), function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
  }

  function signature(keyHex, data) {
    return crypto.subtle.importKey('raw', hexBytes(keyHex), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'])
      .then(function (key) {
        return crypto.subtle.sign('HMAC', key, new Uint8Array([(data >> 16) & 255, (data >> 8) & 255, data & 255]));
      })
      .then(function (buffer) {
        var b = new Uint8Array(buffer);
        return (b[0] << 12) | (b[1] << 4) | (b[2] >> 4);
      });
  }

  function toText(value) {
    var s = '';
    for (var i = 0; i < 8; i++) {
      s = ALPHABET.charAt(value % 32) + s;
      value = Math.floor(value / 32);
    }
    return s.slice(0, 4) + '-' + s.slice(4);
  }

  function toValue(code) {
    var value = 0;
    for (var i = 0; i < 8; i++) value = value * 32 + ALPHABET.indexOf(code.charAt(i));

  }

    hi: {

      wrong: 'यह कोड सही नहीं है। जाँचकर फिर से डालें।',
